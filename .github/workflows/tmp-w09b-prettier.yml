name: Temporary W09-B Prettier

on:
  push:
    branches:
      - wave/09b-event-webhook-schedule-bridge

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Apply canonical Prettier and self-remove diagnostic workflow
        run: |
          npx prettier --write services/n8n-bridge/test/w09b-event-webhook-schedule-bridge.test.ts
          git config user.name "aurora-program-control"
          git config user.email "actions@users.noreply.github.com"
          git add services/n8n-bridge/test/w09b-event-webhook-schedule-bridge.test.ts
          git rm .github/workflows/tmp-w09b-prettier.yml
          git commit -m "style(W09-B): apply canonical Prettier formatting"
          git push origin HEAD:wave/09b-event-webhook-schedule-bridge
