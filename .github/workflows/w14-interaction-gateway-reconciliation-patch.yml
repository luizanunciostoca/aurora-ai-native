name: W14 Interaction Gateway Reconciliation Patch

on:
  push:
    branches:
      - prebuild/w14-v017-interaction-gateway-adapter

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Apply bounded reconciliation patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          adapter = Path('services/mobile-gateway/src/interaction-gateway/adapter.ts')
          text = adapter.read_text()
          old = "        error: error('INTERNAL_FAILURE', 'Interaction gateway operation failed closed.'),"
          new = """        error: error('INTERNAL_FAILURE', 'Interaction gateway operation failed closed.', {
          requiresStateReconciliation: mayMutate,
        }),"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one adapter reconciliation target, found {text.count(old)}')
          adapter.write_text(text.replace(old, new))

          test_file = Path('services/mobile-gateway/test/w14-interaction-gateway-reconciliation.test.ts')
          test_text = test_file.read_text()
          old_import = "import type { CorrelationId, DeviceId, IdentityId, TenantId } from '@aurora/contracts/ids';"
          new_import = """import type { CorrelationId, IdentityId, TenantId } from '@aurora/contracts/ids';
import type { DeviceId } from '../src/device/types.js';"""
          if test_text.count(old_import) != 1:
              raise SystemExit(f'expected exactly one DeviceId import target, found {test_text.count(old_import)}')
          test_file.write_text(test_text.replace(old_import, new_import))
          PY
          npx prettier --write \
            services/mobile-gateway/src/interaction-gateway/adapter.ts \
            services/mobile-gateway/test/w14-interaction-gateway-reconciliation.test.ts
          git diff --check
          git add \
            services/mobile-gateway/src/interaction-gateway/adapter.ts \
            services/mobile-gateway/test/w14-interaction-gateway-reconciliation.test.ts
          git diff --cached --exit-code && {
            echo 'Expected reconciliation patch produced no diff.' >&2
            exit 1
          } || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(W14): reconcile after mutating interaction exception'
          git push origin HEAD:prebuild/w14-v017-interaction-gateway-adapter
