name: Temporary W13-D Prettier

on:
  push:
    branches:
      - wave/13d-google-ads-asset-planning

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Apply canonical Prettier and self-remove diagnostic workflow
        run: |
          npx prettier --write packages/revenue/src/google-ads/asset-planning.ts packages/revenue/test/w13d-google-ads-asset-planning.test.ts
          git config user.name "aurora-program-control"
          git config user.email "actions@users.noreply.github.com"
          git add packages/revenue/src/google-ads/asset-planning.ts packages/revenue/test/w13d-google-ads-asset-planning.test.ts
          git rm .github/workflows/tmp-w13d-prettier.yml
          git commit -m "style(W13-D): apply canonical Prettier formatting"
          git push origin HEAD:wave/13d-google-ads-asset-planning
