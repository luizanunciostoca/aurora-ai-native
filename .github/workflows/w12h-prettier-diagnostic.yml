name: W12-H Prettier Diagnostic

on:
  push:
    branches:
      - wave/12h-meta-ads-reconciliation-acceptance

permissions:
  contents: write

jobs:
  prettier-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave/12h-meta-ads-reconciliation-acceptance
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install canonical workspace
        run: npm ci
      - name: Apply canonical Prettier to W12-H test only
        run: |
          target='packages/revenue/test/w12h-meta-ads-reconciliation-acceptance.test.ts'
          npx prettier --write "$target"
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo 'No formatting changes required.'
            exit 0
          fi
          if [ "$changed" != "$target" ]; then
            echo "Unexpected changed path(s): $changed" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$target"
          git commit -m 'style(w12-h): apply exact canonical Prettier output'
          git push origin HEAD:wave/12h-meta-ads-reconciliation-acceptance
