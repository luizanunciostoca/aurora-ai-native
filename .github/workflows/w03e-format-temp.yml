name: W03-E Format Temp

on:
  push:
    branches:
      - wave/03e-timers-leases-workflow-fallback

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wave/03e-timers-leases-workflow-fallback
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Format W03-E owned files only
        run: >-
          npx prettier --write
          packages/workflow/package.json
          packages/workflow/tsconfig.json
          packages/workflow/tsconfig.build.json
          packages/workflow/src/index.ts
          packages/workflow/src/types.ts
          packages/workflow/src/statements.ts
          packages/workflow/test/w03e-workflow.test.mjs
      - name: Assert formatter scope and publish
        run: |
          set -euo pipefail
          git diff --name-only | grep -Ev '^packages/workflow/' && exit 1 || true
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/workflow
          git commit -m 'chore(w03-e): apply canonical formatting'
          git push origin HEAD:wave/03e-timers-leases-workflow-fallback
