name: W09-A Scratch Supersession Hardening

on:
  push:
    branches: [scratch/w09a-supersession-hardening]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scratch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: scratch/w09a-supersession-hardening
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install canonical workspace
        run: npm ci
      - name: Apply exact supersession hardening
        env:
          W09A_TEST_B64: 
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          registry = Path('services/n8n-bridge/src/bindings/registry.ts')
          text = registry.read_text()
          old = "    if (\n      record.binding.supersedesVersion !== null &&\n      record.binding.supersedesVersion !== expectedPreviousVersion\n    ) {\n      return { ok: false, error: 'INVALID_SUPERSESSION' };\n    }\n"
          new = "    if (record.binding.supersedesVersion !== expectedPreviousVersion) {\n      return { ok: false, error: 'INVALID_SUPERSESSION' };\n    }\n"
          if text.count(old) != 1:
              raise SystemExit('expected activation supersession fence not found exactly once')
          registry.write_text(text.replace(old, new))

          test_file = Path('services/n8n-bridge/test/w09a-n8n-workflow-binding-registry.test.ts')
          tests = test_file.read_text()
          marker = 'W09-A rejects implicit supersession acquired after immutable candidate registration'
          if marker in tests:
              raise SystemExit('hardening test already present')
          test_file.write_text(tests + base64.b64decode(os.environ['W09A_TEST_B64']).decode())
          PY
      - name: Apply canonical Prettier
        run: >-
          npx prettier --write
          services/n8n-bridge/src/bindings/registry.ts
          services/n8n-bridge/test/w09a-n8n-workflow-binding-registry.test.ts
      - name: Commit hardened candidate tree
        shell: bash
        run: |
          set -euo pipefail
          git add services/n8n-bridge/src/bindings/registry.ts \
            services/n8n-bridge/test/w09a-n8n-workflow-binding-registry.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(W09-A): bind activation to declared supersession target'
          git push origin HEAD:scratch/w09a-supersession-hardening
