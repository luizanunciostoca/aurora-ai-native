name: Temporary W15-J Host Formatter

on:
  push:
    branches:
      - wave/15j-real-local-physical-host
    paths:
      - '.github/workflows/prototype-w15j-host-format.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npx prettier --write services/mobile-gateway/src/physical-host/w03-postgres-reservations.ts
      - uses: actions/upload-artifact@v4
        with:
          name: w15j-host-source-formatted
          path: services/mobile-gateway/src/physical-host/w03-postgres-reservations.ts
          if-no-files-found: error
          retention-days: 1
