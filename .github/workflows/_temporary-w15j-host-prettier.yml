name: Temporary W15-J Host Prettier Repair

on:
  push:
    branches:
      - wave/15j-real-local-physical-host-clean

permissions:
  contents: write

jobs:
  format-exact-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave/15j-real-local-physical-host-clean
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Format only CI-reported W15-J files
        run: |
          ./node_modules/.bin/prettier --write \
            services/executors/src/device-dispatch/governed-device-dispatch.ts \
            services/executors/test/w15j-governed-device-dispatch.test.ts \
            services/mobile-gateway/src/gateway-auth/voice-candidate-network.ts \
            services/mobile-gateway/src/gateway-auth/voice-projection-network.ts \
            services/mobile-gateway/src/physical-host/local-physical-host-operator.ts
      - name: Commit exact formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            services/executors/src/device-dispatch/governed-device-dispatch.ts \
            services/executors/test/w15j-governed-device-dispatch.test.ts \
            services/mobile-gateway/src/gateway-auth/voice-candidate-network.ts \
            services/mobile-gateway/src/gateway-auth/voice-projection-network.ts \
            services/mobile-gateway/src/physical-host/local-physical-host-operator.ts; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "aurora-ci-format-bot"
          git config user.email "aurora-ci-format-bot@users.noreply.github.com"
          git add -- \
            services/executors/src/device-dispatch/governed-device-dispatch.ts \
            services/executors/test/w15j-governed-device-dispatch.test.ts \
            services/mobile-gateway/src/gateway-auth/voice-candidate-network.ts \
            services/mobile-gateway/src/gateway-auth/voice-projection-network.ts \
            services/mobile-gateway/src/physical-host/local-physical-host-operator.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore(W15-J): apply canonical Prettier formatting"
          git push origin HEAD:wave/15j-real-local-physical-host-clean
