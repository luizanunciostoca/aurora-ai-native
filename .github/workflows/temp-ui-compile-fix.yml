name: TEMP UI Compile Fix

on:
  push:
    branches:
      - prototype/aurora-tablet-ui-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(ui): stage atomic Compose import fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Apply exact compile fix and self-delete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/aurora-android/app/src/main/kotlin/ai/aurora/ui/AuroraRoot.kt')
          s = p.read_text()
          s = s.replace('import androidx.compose.foundation.layout.Column\n', 'import androidx.compose.foundation.layout.Column\nimport androidx.compose.foundation.layout.ColumnScope\n')
          s = s.replace('import androidx.compose.material3.DarkColorScheme\n', 'import androidx.compose.material3.ColorScheme\n')
          s = s.replace('val scheme: DarkColorScheme = darkColorScheme(', 'val scheme: ColorScheme = darkColorScheme(')
          p.write_text(s)
          PY
          rm .github/workflows/temp-ui-compile-fix.yml
          git config user.name aurora-program-control
          git config user.email actions@users.noreply.github.com
          git add apps/aurora-android/app/src/main/kotlin/ai/aurora/ui/AuroraRoot.kt .github/workflows/temp-ui-compile-fix.yml
          git commit -m 'fix(ui): correct Compose theme imports'
          git push origin HEAD:prototype/aurora-tablet-ui-v1
