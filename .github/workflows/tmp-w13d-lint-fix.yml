name: Temporary W13-D Lint Fix

on:
  push:
    branches:
      - wave/13d-google-ads-asset-planning

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Remove forbidden non-null assertions and validate
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('packages/revenue/test/w13d-google-ads-asset-planning.test.ts')
          text = path.read_text()
          old = """test('W13-D fails closed on provenance, duplicate assets, malformed costs and incompatible capability', () => {\n  const invalidProvenance: GoogleAdsPlanningAsset = {\n    ...pmaxAssets()[0]!,\n"""
          new = """test('W13-D fails closed on provenance, duplicate assets, malformed costs and incompatible capability', () => {\n  const [firstPmaxAsset] = pmaxAssets();\n  if (!firstPmaxAsset) throw new Error('PMax fixture unexpectedly empty');\n\n  const invalidProvenance: GoogleAdsPlanningAsset = {\n    ...firstPmaxAsset,\n"""
          if old not in text:
              raise SystemExit('first non-null assertion anchor not found')
          text = text.replace(old, new, 1)
          old2 = """  assert.deepEqual(planGoogleAdsAssets(fixture({ assets: [...pmaxAssets(), pmaxAssets()[0]!] })), {\n"""
          new2 = """  assert.deepEqual(planGoogleAdsAssets(fixture({ assets: [...pmaxAssets(), firstPmaxAsset] })), {\n"""
          if old2 not in text:
              raise SystemExit('second non-null assertion anchor not found')
          text = text.replace(old2, new2, 1)
          path.write_text(text)
          PY
          npx prettier --write packages/revenue/test/w13d-google-ads-asset-planning.test.ts
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
          git config user.name "aurora-program-control"
          git config user.email "actions@users.noreply.github.com"
          git add packages/revenue/test/w13d-google-ads-asset-planning.test.ts
          git rm .github/workflows/tmp-w13d-lint-fix.yml
          git commit -m "test(W13-D): remove forbidden non-null assertions"
          git push origin HEAD:wave/13d-google-ads-asset-planning
