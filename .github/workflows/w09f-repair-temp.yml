name: W09F Repair Temp

on:
  push:
    branches:
      - wave/09f-governance-replay-integration

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave/09f-governance-replay-integration
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Sanitize synthetic idempotency fixtures
        run: sed -i 's/idem-w09f-/key-/g' services/n8n-bridge/test/w09f-governance-replay-failure-integration.test.ts
      - name: Canonical formatter
        run: npx prettier --write services/n8n-bridge/test/w09f-governance-replay-failure-integration.test.ts docs/governance/w09/W09_FABRIC_HANDOFF.md
      - name: Validate full test suite
        run: npm test
      - name: Publish repaired permanent files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/n8n-bridge/test/w09f-governance-replay-failure-integration.test.ts docs/governance/w09/W09_FABRIC_HANDOFF.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(w09): sanitize replay fixtures and format acceptance artifacts'
          git push origin HEAD:wave/09f-governance-replay-integration
