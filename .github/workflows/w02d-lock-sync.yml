name: W02-D Lock Sync

on:
  push:
    branches:
      - wave/02d-policy-engine

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - name: Generate canonical lock metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lock if needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already canonical"
            exit 0
          fi
          if [ -n "$(git status --porcelain | grep -v '^ M package-lock.json$')" ]; then
            echo "Unexpected files changed during lock sync"
            git status --short
            exit 1
          fi
          git config user.name "aurora-governance-bot"
          git config user.email "aurora-governance-bot@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(W02-D): sync policy workspace lockfile"
          git push origin HEAD:wave/02d-policy-engine
