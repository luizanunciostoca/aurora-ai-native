name: W14-F Format Finalizer Diagnostic

on:
  push:
    branches:
      - wave/14f-device-command-delivery

permissions:
  contents: write

jobs:
  finalize-format:
    if: ${{ !contains(github.event.head_commit.message, '[w14f-format-done]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Add permanent W14-F regressions
        shell: bash
        run: |
          cat >> services/mobile-gateway/src/device-command-delivery/test/w14f-device-command-delivery.test.ts <<'EOF'

          test('expired trust cannot acknowledge or release ordered delivery', () => {
            const manager = new DeviceCommandDeliveryManager(new DurablePort());
            const firstCommand = command(COMMAND_1, EXECUTION_1);
            const secondCommand = command(COMMAND_2, EXECUTION_2);
            assert.equal(
              manager.prepare({
                command: firstCommand,
                deviceSession: trust(),
                idempotencyKey: 'idem-expired-ack-1',
                orderingKey: 'expired-ack-order',
                orderingSequence: 1,
                nowMs: 1_100,
              }).ok,
              true,
            );
            assert.equal(
              manager.prepare({
                command: secondCommand,
                deviceSession: trust(),
                idempotencyKey: 'idem-expired-ack-2',
                orderingKey: 'expired-ack-order',
                orderingSequence: 2,
                nowMs: 1_100,
              }).ok,
              true,
            );
            const first = manager.claim({
              command: firstCommand,
              deviceSession: trust(),
              nowMs: 1_200,
            });
            assert.equal(first.ok, true);
            if (!first.ok) return;

            const expiredAck = manager.acknowledge({
              command: firstCommand,
              deviceSession: { ...trust(), gatewayAuthExpiresAtMs: 1_250 },
              deliveryReference: first.value.delivery.deliveryReference,
              ackReference: 'ack-expired',
              observedAtMs: 1_300,
            });
            assert.equal(expiredAck.ok, false);
            if (!expiredAck.ok) assert.equal(expiredAck.error.code, 'SESSION_EXPIRED');

            const second = manager.claim({
              command: secondCommand,
              deviceSession: trust(),
              nowMs: 1_400,
            });
            assert.equal(second.ok, false);
            if (!second.ok) assert.equal(second.error.code, 'ORDERING_BLOCKED');
          });

          test('acknowledged eviction advances ordering floor without creating a gap', () => {
            const manager = new DeviceCommandDeliveryManager(new DurablePort(), {
              maxTrackedDeliveries: 2,
            });
            const firstCommand = command(COMMAND_1, EXECUTION_1);
            const secondCommand = command(COMMAND_2, EXECUTION_2);
            const thirdCommand = command(
              'cmd_01ARZ3NDEKTSV4RRFFQ69G5FAX' as CommandId,
              'exe_01ARZ3NDEKTSV4RRFFQ69G5FAX' as ExecutionId,
            );

            assert.equal(
              manager.prepare({
                command: firstCommand,
                deviceSession: trust(),
                idempotencyKey: 'idem-evict-1',
                orderingKey: 'evict-order',
                orderingSequence: 1,
                nowMs: 1_100,
              }).ok,
              true,
            );
            const first = manager.claim({
              command: firstCommand,
              deviceSession: trust(),
              nowMs: 1_200,
            });
            assert.equal(first.ok, true);
            if (!first.ok) return;
            assert.equal(
              manager.acknowledge({
                command: firstCommand,
                deviceSession: trust(),
                deliveryReference: first.value.delivery.deliveryReference,
                ackReference: 'ack-evict-1',
                observedAtMs: 1_300,
              }).ok,
              true,
            );

            assert.equal(
              manager.prepare({
                command: secondCommand,
                deviceSession: trust(),
                idempotencyKey: 'idem-evict-2',
                orderingKey: 'evict-order',
                orderingSequence: 2,
                nowMs: 1_400,
              }).ok,
              true,
            );
            assert.equal(
              manager.prepare({
                command: thirdCommand,
                deviceSession: trust(),
                idempotencyKey: 'idem-evict-3',
                orderingKey: 'evict-order',
                orderingSequence: 3,
                nowMs: 1_500,
              }).ok,
              true,
            );

            const second = manager.claim({
              command: secondCommand,
              deviceSession: trust(),
              nowMs: 1_600,
            });
            assert.equal(second.ok, true);
            if (!second.ok) return;
            assert.equal(
              manager.acknowledge({
                command: secondCommand,
                deviceSession: trust(),
                deliveryReference: second.value.delivery.deliveryReference,
                ackReference: 'ack-evict-2',
                observedAtMs: 1_700,
              }).ok,
              true,
            );

            const third = manager.claim({
              command: thirdCommand,
              deviceSession: trust(),
              nowMs: 1_800,
            });
            assert.equal(third.ok, true);
          });
          EOF
      - name: Apply canonical Prettier config and remove temporary test diagnostic
        shell: bash
        run: |
          npx prettier --write \
            services/mobile-gateway/src/device-command-delivery/manager.ts \
            services/mobile-gateway/src/device-command-delivery/test/w14f-device-command-delivery.test.ts
          git rm packages/control/test/w14f-prettier-output-diagnostic.test.ts
      - name: Commit final W14-F candidate changes
        shell: bash
        run: |
          git config user.name 'aurora-acceptance-bot'
          git config user.email 'aurora-acceptance-bot@users.noreply.github.com'
          git add services/mobile-gateway/src/device-command-delivery/manager.ts \
            services/mobile-gateway/src/device-command-delivery/test/w14f-device-command-delivery.test.ts
          git commit -m 'fix(W14-F): finalize delivery regressions and formatting [w14f-format-done]'
          git push origin HEAD:wave/14f-device-command-delivery
