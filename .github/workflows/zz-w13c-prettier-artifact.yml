name: TEMP W13-C Prettier Artifact

on:
  push:
    branches:
      - wave/13c-google-ads-search-planning
    paths:
      - .github/workflows/zz-w13c-prettier-artifact.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier@3.9.6 --write packages/revenue/test/w13c-google-ads-search-planning.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: w13c-prettier-output
          path: packages/revenue/test/w13c-google-ads-search-planning.test.ts
          retention-days: 1
