name: W06-I Prettier Finalizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'wave/06i-aurora-memory-fabric'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave/06i-aurora-memory-fabric
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install workspace
        run: npm ci
      - name: Format W06-I files and remove temporary diagnostics
        run: |
          npx prettier --write \
            packages/context/src/memory-fabric/fabric.ts \
            packages/context/src/memory-fabric/index.ts \
            packages/context/src/memory-fabric/source-adapter.ts \
            packages/context/src/memory-fabric/types.ts \
            packages/context/test/w06i-memory-fabric.test.ts
          rm -f packages/context/test/w06i-format-diagnostic.test.ts
          rm -f .github/workflows/w06i-prettier-artifact.yml
      - name: Commit exact formatted candidate
        run: |
          git config user.name 'aurora-ci-finalizer'
          git config user.email 'aurora-ci-finalizer@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'style: format W06-I memory fabric and remove diagnostics'
          git push origin HEAD:wave/06i-aurora-memory-fabric
