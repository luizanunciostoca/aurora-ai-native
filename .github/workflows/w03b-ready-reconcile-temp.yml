name: W03-B Ready Reconcile Temp

on:
  push:
    branches:
      - wave/03b-outbox-inbox-idempotency

permissions:
  contents: write
  pull-requests: write

jobs:
  ready-and-self-delete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout lane branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave/03b-outbox-inbox-idempotency
      - name: Mark PR 81 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 81 --repo luizanunciostoca/aurora-ai-native
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/w03b-ready-reconcile-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(W03-B): remove temporary ready reconciler'
          git push origin HEAD:wave/03b-outbox-inbox-idempotency
