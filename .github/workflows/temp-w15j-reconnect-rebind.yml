name: TEMP W15-J Reconnect Rebind Patch

on:
  push:
    branches:
      - wave/15j-physical-device-integration-acceptance
    paths:
      - '.github/workflows/temp-w15j-reconnect-rebind.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave/15j-physical-device-integration-acceptance
          fetch-depth: 0
      - name: Apply exact reconnect patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git apply --check .github/temp-w15j-reconnect-rebind.patch
          git apply .github/temp-w15j-reconnect-rebind.patch
          rm .github/temp-w15j-reconnect-rebind.patch
          rm .github/workflows/temp-w15j-reconnect-rebind.yml
          git diff --check
      - name: Commit and push only if branch is unchanged
        shell: bash
        env:
          BRANCH: wave/15j-physical-device-integration-acceptance
        run: |
          set -euo pipefail
          git config user.name 'aurora-program-control'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(W15-J): rebind DeviceRef before session resume'
          remote_sha="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
