name: W14-B Mutation Guard Scratch

on:
  push:
    branches:
      - scratch/w14b-mutation-guard

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Apply no-mutation-before-validation guard
        env:
          OLD_B64: 
          NEW_B64: 
          ADD_B64: 
        run: |
          python3 -c "import base64,os; from pathlib import Path; p=Path('services/mobile-gateway/src/realtime-session/manager.ts'); t=p.read_text(); old=base64.b64decode(os.environ['OLD_B64']).decode(); new=base64.b64decode(os.environ['NEW_B64']).decode(); assert old in t; p.write_text(t.replace(old,new,1)); q=Path('services/mobile-gateway/src/realtime-session/test/w14b-realtime-command-session.test.ts'); s=q.read_text(); a=base64.b64decode(os.environ['ADD_B64']).decode(); assert 'invalid open cannot evict a remembered closed realtime session' not in s; q.write_text(s+a)"
          npx prettier --write services/mobile-gateway/src/realtime-session/manager.ts services/mobile-gateway/src/realtime-session/test/w14b-realtime-command-session.test.ts
      - name: Validate focused W14-B after patch
        run: |
          npm run build --workspace @aurora/contracts
          ./node_modules/.bin/tsc --project services/mobile-gateway/src/realtime-session/tsconfig.build.json --pretty false
          ./node_modules/.bin/tsc --project services/mobile-gateway/src/realtime-session/tsconfig.test.json --pretty false
          node --test services/mobile-gateway/src/realtime-session/dist-test/realtime-session/test/w14b-realtime-command-session.test.js
          rm -rf services/mobile-gateway/src/realtime-session/dist services/mobile-gateway/src/realtime-session/dist-test packages/contracts/dist
      - name: Commit guarded blobs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/mobile-gateway/src/realtime-session/manager.ts services/mobile-gateway/src/realtime-session/test/w14b-realtime-command-session.test.ts
          git commit -m 'fix(W14-B): validate binding before retention mutation'
          git push
