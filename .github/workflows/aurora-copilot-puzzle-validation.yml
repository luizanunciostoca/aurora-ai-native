name: Aurora Puzzle Validation

on:
  pull_request:
    paths:
      - '.github/agents/**'
      - '.github/workflows/aurora-copilot-puzzle-validation.yml'
      - '.github/workflows/aurora-copilot-orchestrator.yml'
      - '.github/workflows/aurora-copilot-free-worker.yml'
      - 'docs/governance/copilot/**'
      - 'tools/copilot/**'
  push:
    branches: [main]
    paths:
      - '.github/agents/**'
      - '.github/workflows/aurora-copilot-puzzle-validation.yml'
      - '.github/workflows/aurora-copilot-orchestrator.yml'
      - '.github/workflows/aurora-copilot-free-worker.yml'
      - 'docs/governance/copilot/**'
      - 'tools/copilot/**'

permissions:
  contents: read

jobs:
  validate-puzzle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate 166-task graph and Puzzle metadata
        run: node tools/copilot/load-task-graph.mjs
      - name: Validate physical, logical and runtime execution capacities
        run: node tools/copilot/validate-execution-mode.mjs
      - name: Validate PRO+ runtime capacity, leases and telemetry
        run: node --test tools/copilot/pro-plus-runtime.test.mjs
      - name: Set up canonical Node for temporary diagnostic
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - name: TEMP PRO+ canonical Prettier diagnostic
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          cp tools/copilot/runtime-capacity.mjs /tmp/runtime-capacity.before.mjs
          npx prettier --write tools/copilot/runtime-capacity.mjs >/dev/null
          echo 'PRO_PLUS_PRETTIER_PATCH_BEGIN'
          diff -u /tmp/runtime-capacity.before.mjs tools/copilot/runtime-capacity.mjs || true
          echo 'PRO_PLUS_PRETTIER_PATCH_END'
      - name: Validate canonical BUILD frontier safety
        run: node tools/copilot/frontier-policy.test.mjs
      - name: Validate Puzzle scheduling semantics
        run: node tools/copilot/puzzle-policy.test.mjs
      - name: Validate PREBUILD artifact authority boundary
        run: node tools/copilot/puzzle-prebuild-artifact.test.mjs
      - name: Verify Puzzle control-plane invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PUZZLE_FRONTIER' docs/governance/copilot/AURORA_COPILOT_EXECUTION_MODE.json
          grep -q 'runtimeCapabilityDiscovery' docs/governance/copilot/AURORA_COPILOT_EXECUTION_MODE.json
          grep -q 'MINIMUM_SAFE_DIMENSION' docs/governance/copilot/AURORA_COPILOT_EXECUTION_MODE.json
          grep -q 'FAIL_CLOSED_UNTIL_RECONCILED' docs/governance/copilot/AURORA_COPILOT_EXECUTION_MODE.json
          grep -q 'aurora.pro_plus.development_telemetry.v1' docs/governance/copilot/AURORA_COPILOT_EXECUTION_MODE.json
          grep -q 'maxLogicalLanes' docs/governance/copilot/AURORA_COPILOT_EXECUTION_MODE.json
          grep -q 'ARTIFACT_ONLY_UNTIL_DEPENDENCIES_ACCEPTED' docs/governance/copilot/AURORA_COPILOT_EXECUTION_MODE.json
          grep -q 'REQUIRED_BEFORE_BUILD_PROMOTION' docs/governance/copilot/AURORA_COPILOT_EXECUTION_MODE.json
          grep -q 'projectActiveSessionLeases' tools/copilot/claim-free-ready.mjs
          grep -q 'calculateDynamicSafeBuildCapacity' tools/copilot/claim-free-ready.mjs
          grep -q 'aurora:puzzle-prebuild' tools/copilot/materialize-ready.mjs
          grep -q 'aurora:puzzle-readiness' tools/copilot/materialize-ready.mjs
          grep -q 'canonicalAuthority must be false' tools/copilot/puzzle-prebuild-artifact.mjs
          grep -q 'PREBUILD_PATH_FENCE_VIOLATION' tools/copilot/puzzle-prebuild-artifact.mjs
          grep -q 'Massively Parallel Program Execution Standard' docs/governance/copilot/AURORA_PUZZLE_MASSIVELY_PARALLEL_EXECUTION_STANDARD.md
