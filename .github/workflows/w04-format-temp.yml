name: W04 JSON Format Temp

on:
  push:
    branches:
      - wave/04-00-coordination-freeze

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wave/04-00-coordination-freeze
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/governance/copilot/tasks/W04.json
      - name: Assert scope and publish
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "docs/governance/copilot/tasks/W04.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/governance/copilot/tasks/W04.json
          git commit -m 'chore(w04): format machine graph metadata'
          git push origin HEAD:wave/04-00-coordination-freeze
