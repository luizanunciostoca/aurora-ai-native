name: Scratch Prettier Diff

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prettier-diff:
    if: github.head_ref == 'scratch/w08c-prettier-diff'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Emit canonical formatting diff
        shell: bash
        run: |
          npx prettier --write packages/providers/src/read/reader.ts packages/providers/test/w08c-read-adapter.test.ts
          echo '---BEGIN_PRETTIER_DIFF---'
          git diff -- packages/providers/src/read/reader.ts packages/providers/test/w08c-read-adapter.test.ts
          echo '---END_PRETTIER_DIFF---'
