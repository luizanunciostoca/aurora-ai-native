name: W14 Interaction Manager Fourth Review Patch

on:
  push:
    branches:
      - prebuild/w14-v017-interaction-manager

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Apply bounded fourth-review invariants
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const path = 'services/mobile-gateway/src/interaction-session/manager.ts';
          let text = readFileSync(path, 'utf8');

          function replaceOnce(before, after, label) {
            const first = text.indexOf(before);
            if (first < 0) throw new Error(`missing patch target: ${label}`);
            if (text.indexOf(before, first + before.length) >= 0) {
              throw new Error(`non-unique patch target: ${label}`);
            }
            text = text.slice(0, first) + after + text.slice(first + before.length);
          }

          replaceOnce(
            `  const subMillisecondNanoseconds = BigInt(paddedFraction.slice(3) || '0');\n  return BigInt(epochMs) * NANOSECONDS_PER_MILLISECOND + subMillisecondNanoseconds;`,
            `  const subMillisecondNanoseconds = BigInt(paddedFraction.slice(3) || '0');\n  const epochNanoseconds =\n    BigInt(epochMs) * NANOSECONDS_PER_MILLISECOND + subMillisecondNanoseconds;\n  if (\n    epochNanoseconds < MIN_RFC3339_TIMESTAMP_NS ||\n    epochNanoseconds > MAX_RFC3339_TIMESTAMP_NS\n  ) {\n    throw new TypeError('interaction timestamp is outside the canonical RFC3339 UTC range');\n  }\n  return epochNanoseconds;`,
            'UTC RFC3339 bound',
          );

          replaceOnce(
            `  let previousOccurredAtNs = createdAtNs;\n  const turns = parsed.turns.map((turn) => {\n    const occurredAtNs = rfc3339EpochNanoseconds(turn.occurredAt);\n    if (occurredAtNs < previousOccurredAtNs || occurredAtNs > updatedAtNs) {\n      throw new TypeError('interaction turn timestamp is outside exact session bounds');\n    }\n    previousOccurredAtNs = occurredAtNs;\n    return freezeTurn(turn);\n  });\n  if (parsed.resume.resumable && parsed.resume.resumableUntil !== undefined) {\n    if (rfc3339EpochNanoseconds(parsed.resume.resumableUntil) <= updatedAtNs) {\n      throw new TypeError('resumable interaction expiry must be after updatedAt');\n    }\n  }`,
            `  let previousOccurredAtNs = createdAtNs;\n  let previousClassificationRank = -1;\n  let highestTurnClassification;\n  const seenTurnIds = new Set<string>();\n  const turns = parsed.turns.map((turn) => {\n    if (seenTurnIds.has(turn.interactionTurnId)) {\n      throw new TypeError('interaction session cannot contain duplicate turn identities');\n    }\n    seenTurnIds.add(turn.interactionTurnId);\n    const classificationRank = CLASSIFICATION_RANK[turn.dataClassification];\n    if (classificationRank < previousClassificationRank) {\n      throw new TypeError('interaction turn classifications cannot downgrade over time');\n    }\n    previousClassificationRank = classificationRank;\n    highestTurnClassification = turn.dataClassification;\n    const occurredAtNs = rfc3339EpochNanoseconds(turn.occurredAt);\n    if (occurredAtNs < previousOccurredAtNs || occurredAtNs > updatedAtNs) {\n      throw new TypeError('interaction turn timestamp is outside exact session bounds');\n    }\n    previousOccurredAtNs = occurredAtNs;\n    return freezeTurn(turn);\n  });\n  if (\n    highestTurnClassification !== undefined &&\n    parsed.dataClassification !== highestTurnClassification\n  ) {\n    throw new TypeError('interaction session classification must equal its highest observed turn');\n  }\n  if (parsed.resume.resumable) {\n    if (parsed.state !== 'SUSPENDED' || parsed.resume.resumableUntil === undefined) {\n      throw new TypeError('resumable interaction must be suspended with an expiry');\n    }\n    if (rfc3339EpochNanoseconds(parsed.resume.resumableUntil) <= updatedAtNs) {\n      throw new TypeError('resumable interaction expiry must be after updatedAt');\n    }\n  }`,
            'persisted session invariants',
          );

          writeFileSync(path, text);
          NODE
          npx prettier --write services/mobile-gateway/src/interaction-session/manager.ts
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/mobile-gateway/src/interaction-session/manager.ts
          git diff --cached --quiet && { echo 'patch produced no diff' >&2; exit 1; }
          git commit -m 'fix(W14): enforce persisted interaction invariants'
          git push origin HEAD:prebuild/w14-v017-interaction-manager
