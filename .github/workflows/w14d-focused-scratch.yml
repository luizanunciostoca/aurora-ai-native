name: W14-D Focused Scratch

on:
  push:
    branches:
      - scratch/w14d-focused-ed622

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scratch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Create scratch-only mobile-gateway test harness
        shell: bash
        run: |
          cat > services/mobile-gateway/tsconfig.json <<'JSON'
          {
            "extends": "../../tsconfig.base.json",
            "compilerOptions": {
              "module": "NodeNext",
              "moduleResolution": "NodeNext",
              "baseUrl": ".",
              "paths": {
                "@aurora/contracts": ["../../packages/contracts/src/index.ts"],
                "@aurora/contracts/*": ["../../packages/contracts/src/*/index.ts"]
              }
            },
            "include": ["src/**/*.ts"],
            "exclude": ["dist", "dist-test", "node_modules"]
          }
          JSON
          cat > services/mobile-gateway/tsconfig.test.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "declaration": false,
              "declarationMap": false,
              "sourceMap": false,
              "rootDir": ".",
              "outDir": "dist-test",
              "paths": {}
            },
            "include": ["src/**/*.ts", "test/**/*.ts"],
            "exclude": ["dist", "dist-test", "node_modules"]
          }
          JSON
      - name: Build canonical contracts dependency
        run: npm run build --workspace @aurora/contracts
      - name: Typecheck and compile focused W14-D harness
        run: ./node_modules/.bin/tsc --project services/mobile-gateway/tsconfig.test.json --pretty false
      - name: Execute W14-D focused tests
        run: node --test services/mobile-gateway/dist-test/test/w14d-device-registration.test.js
      - name: Confirm scratch harness did not change W14-D candidate files
        run: git diff --exit-code -- services/mobile-gateway/src/device services/mobile-gateway/test/w14d-device-registration.test.ts
