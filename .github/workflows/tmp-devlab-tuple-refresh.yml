name: Temporary DevLab tuple refresh

on:
  push:
    branches:
      - tooling/tablet-devlab-tuple-32f1056e

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[tuple-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tooling/tablet-devlab-tuple-32f1056e
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Refresh exact W15-J tablet tuple
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('docs/governance/w15/W15J_TABLET_ONLY_DEVLAB.md'),
              Path('tools/tablet-devlab/README.md'),
              Path('tools/tablet-devlab/capture-control-tower-tuple.sh'),
              Path('tools/tablet-devlab/fetch-current-artifact.sh'),
              Path('tools/tablet-devlab/install-exact-apk.sh'),
              Path('tools/tablet-devlab/tablet-preflight.sh'),
              Path('tools/tablet-devlab/worktrees.sh'),
              Path('tools/test/tablet-devlab.test.mjs'),
          ]
          replacements = {
              'e280e742321638a852c68346b26cd0cdd69010eb': '32f1056ea154eab5b9b85ec83038caf87c4227f8',
              'c2375e555caf719130755979b69a57e3133246f6': 'd4afbb5ce2af375bdc8b9ce1d9bb5f1334fefb9d',
              '34155218889': '34640068366',
              '10030765116': '10279418601',
              'aurora-w15j-tablet-loopback-apk-6d44480e-host-e280e742': 'aurora-w15j-tablet-loopback-apk-6d44480e-host-32f1056e',
              '785668c03552c66f2dcfecca71ac961afe1f96f77ceb4739816d2b42f9094afe': 'a9424ba840aefd4111b777bab0b7d30605139bae94f8424233146067bf9f9f88',
              '7e09c3473fa235a8f442f275ed99f33a136ceb2c63bd80c5a2eb03cbfaa6eb82': '0b7fb1210068d05d16d10242cd9b9c46ac32254423d3a7d824d49ea0e2cd2b35',
          }

          changed = []
          aggregate = ''
          for path in files:
              text = path.read_text()
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed.append(str(path))
              aggregate += text

          if len(changed) != len(files):
              raise SystemExit(f'expected all {len(files)} tuple files to change; changed={changed}')
          for old in replacements:
              if old in aggregate:
                  raise SystemExit(f'stale tuple token remains: {old}')
          print('tuple_files_refreshed=' + str(len(changed)))
          PY
      - run: npm run format
      - run: node --test tools/test/tablet-devlab.test.mjs
      - name: Commit tuple refresh
        shell: bash
        run: |
          git config user.name "aurora-ci"
          git config user.email "aurora-ci@users.noreply.github.com"
          git add \
            docs/governance/w15/W15J_TABLET_ONLY_DEVLAB.md \
            tools/tablet-devlab/README.md \
            tools/tablet-devlab/capture-control-tower-tuple.sh \
            tools/tablet-devlab/fetch-current-artifact.sh \
            tools/tablet-devlab/install-exact-apk.sh \
            tools/tablet-devlab/tablet-preflight.sh \
            tools/tablet-devlab/worktrees.sh \
            tools/test/tablet-devlab.test.mjs
          git commit -m "chore(devlab): refresh exact W15-J tuple for host 32f1056e [tuple-refresh]"
          git push origin HEAD:tooling/tablet-devlab-tuple-32f1056e
