name: TEMP W11-H Prettier Artifact

on:
  push:
    branches:
      - wave/11h-social-e2e-validation
    paths:
      - .github/workflows/zz-w11h-prettier-artifact.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier@3.9.6 --write packages/revenue/test/w11h-social-e2e-validation.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: w11h-prettier-output
          path: packages/revenue/test/w11h-social-e2e-validation.test.ts
          retention-days: 1
