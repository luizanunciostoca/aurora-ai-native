name: PR78 Ready Reconcile Temp

on:
  push:
    branches:
      - wave/03-program-control-parallel-standard
    paths:
      - '.github/workflows/pr78-ready-reconcile-temp.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  ready-and-self-delete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Program Control branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave/03-program-control-parallel-standard
          fetch-depth: 0
          persist-credentials: true
      - name: Mark PR 78 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 78 --repo luizanunciostoca/aurora-ai-native
      - name: Remove temporary workflow from candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr78-ready-reconcile-temp.yml
          git commit -m 'chore(program-control): remove temporary PR ready reconciler'
          git push origin HEAD:wave/03-program-control-parallel-standard
