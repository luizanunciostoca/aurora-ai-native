name: Prototype W15-J Physical APK Artifact

on:
  push:
    branches:
      - prototype/w15j-physical-apk-artifact
    paths:
      - '.github/workflows/prototype-w15j-physical-apk-artifact.yml'

permissions:
  contents: read

jobs:
  build-exact-w15j-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Assert canonical packaging invocation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF_NAME" = "prototype/w15j-physical-apk-artifact"
          test "$GITHUB_SHA" = "$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
      - name: Checkout exact W15-J candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 70052754d9b6080612896105e346176c3110814e
          persist-credentials: false
      - name: Assert exact source candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "70052754d9b6080612896105e346176c3110814e"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
      - name: Install stable Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Test, assemble and self-bind exact localDebug candidate
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain -p apps/aurora-android \
            :app:testLocalDebugUnitTest \
            :app:assembleLocalDebug

          APK="$(find apps/aurora-android/app/build/outputs/apk/local/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$AAPT"
          BADGING="$($AAPT dump badging "$APK" | sed -n '1p')"
          PACKAGE_ID="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")"
          test "$PACKAGE_ID" = "ai.aurora.device.local"
          test "$VERSION_CODE" = "1"
          test "$VERSION_NAME" = "0.15.0-alpha.1-local"

          ARTIFACT_DIR=/tmp/w15j-physical-apk
          mkdir -p "$ARTIFACT_DIR"
          cp "$APK" "$ARTIFACT_DIR/Aurora-W15J-Physical-localDebug.apk"
          (
            cd "$ARTIFACT_DIR"
            sha256sum Aurora-W15J-Physical-localDebug.apk > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

          cat > "$ARTIFACT_DIR/BUILD_IDENTITY.txt" <<EOF
          artifact_purpose=W15-J-DP5-physical-evidence-input
          source_candidate_sha=70052754d9b6080612896105e346176c3110814e
          source_branch=wave/15j-physical-device-integration-acceptance
          paired_local_host_candidate_sha=2831fdfb6e52d5234ad8a53ca2040c2d3f827dd8
          reconciled_main_parent_sha=9f9164e1b4777b0eeb6a61b647da794e1fcce3ce
          packaging_head_sha=${GITHUB_SHA}
          packaging_branch=prototype/w15j-physical-apk-artifact
          packaging_run_id=${GITHUB_RUN_ID}
          gateway_environment=LOCAL
          device_gateway_port=8080
          bootstrap_port=8081
          gateway_transport_scope=LOCAL_ADB_REVERSE_ONLY
          apk_variant=localDebug
          package_id=${PACKAGE_ID}
          version_code=${VERSION_CODE}
          version_name=${VERSION_NAME}
          canonical_acceptance=false
          physical_evidence_required=true
          dp5_status=INCOMPLETE
          EOF

          test "$(wc -l < "$ARTIFACT_DIR/BUILD_IDENTITY.txt" | tr -d ' ')" = "19"
          test "$(find "$ARTIFACT_DIR" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
      - name: Upload exact W15-J candidate APK
        uses: actions/upload-artifact@v7
        with:
          name: aurora-w15j-physical-apk-70052754-host-2831fdfb
          path: /tmp/w15j-physical-apk
          if-no-files-found: error
          retention-days: 14
