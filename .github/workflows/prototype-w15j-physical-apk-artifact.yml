name: Prototype W15-J Tablet Loopback APK Artifact

on:
  push:
    branches:
      - prototype/w15j-physical-apk-artifact
    paths:
      - '.github/workflows/prototype-w15j-physical-apk-artifact.yml'

permissions:
  contents: read
  actions: read

jobs:
  rebind-exact-w15j-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assert canonical packaging invocation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF_NAME" = "prototype/w15j-physical-apk-artifact"
          test "$GITHUB_SHA" = "$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"

      - name: Fetch and verify previously certified r11 presign artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_ARTIFACT_ID=10520682075
          SOURCE_ZIP_SHA=c5cbe5e10f4c78ff7aa7dc8c5d6635c151256122343330f120114d4ffcb97fc2
          PRESIGN_SHA=a813d5eb389b171a28a944bf93c65c98031cd6945685c942900ef856d7c6d88d
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o /tmp/source-r11.zip
          printf '%s  %s\n' "$SOURCE_ZIP_SHA" /tmp/source-r11.zip | sha256sum -c -
          mkdir -p /tmp/source-r11
          unzip -q /tmp/source-r11.zip -d /tmp/source-r11
          test "$(find /tmp/source-r11 -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          test "$(wc -l < /tmp/source-r11/BUILD_IDENTITY.txt | tr -d ' ')" = "24"
          grep -Fxq 'source_candidate_sha=fb05c7880667d6f179648043e6f1e7b966734134' /tmp/source-r11/BUILD_IDENTITY.txt
          grep -Fxq 'source_branch=wave/15j-dp5-consolidated-hardening-rc' /tmp/source-r11/BUILD_IDENTITY.txt
          grep -Fxq 'paired_local_host_candidate_sha=df17c9f27a8206f8296f55aa3830667f4742b062' /tmp/source-r11/BUILD_IDENTITY.txt
          read -r OBSERVED_SHA APK_NAME </tmp/source-r11/SHA256SUMS.txt
          test "$OBSERVED_SHA" = "$PRESIGN_SHA"
          test "$(sha256sum "/tmp/source-r11/$APK_NAME" | awk '{print $1}')" = "$PRESIGN_SHA"

      - name: Rebind provenance without rebuilding APK bytes
        shell: bash
        run: |
          set -euo pipefail
          PRESIGN_SHA=a813d5eb389b171a28a944bf93c65c98031cd6945685c942900ef856d7c6d88d
          ARTIFACT_DIR=/tmp/w15j-tablet-loopback-apk
          mkdir -p "$ARTIFACT_DIR"
          read -r OBSERVED_SHA APK_NAME </tmp/source-r11/SHA256SUMS.txt
          test "$OBSERVED_SHA" = "$PRESIGN_SHA"
          cp "/tmp/source-r11/$APK_NAME" "$ARTIFACT_DIR/Aurora-W15J-v017r11-TabletLoopback-localDebug-presign.apk"
          printf '%s  %s\n' "$PRESIGN_SHA" Aurora-W15J-v017r11-TabletLoopback-localDebug-presign.apk >"$ARTIFACT_DIR/SHA256SUMS.txt"
          cat >"$ARTIFACT_DIR/BUILD_IDENTITY.txt" <<EOF
          artifact_purpose=W15-J-DP5-physical-evidence-input
          source_candidate_sha=fb05c7880667d6f179648043e6f1e7b966734134
          source_branch=wave/15j-physical-device-integration-acceptance
          paired_local_host_candidate_sha=df17c9f27a8206f8296f55aa3830667f4742b062
          reconciled_main_parent_sha=77f0f8532197025ee913dd02fcb56878d9d667a9
          packaging_head_sha=${GITHUB_SHA}
          packaging_branch=prototype/w15j-physical-apk-artifact
          packaging_run_id=${GITHUB_RUN_ID}
          gateway_environment=LOCAL
          device_gateway_port=8080
          bootstrap_port=8081
          gateway_transport_scope=LOCAL_TABLET_LOOPBACK
          gateway_origin=http://127.0.0.1:8080
          apk_variant=localDebug
          package_id=ai.aurora.device.local
          version_code=4
          version_name=0.17.0-dev.1-local
          canonical_acceptance=false
          physical_evidence_required=true
          dp5_status=INCOMPLETE
          input_signing_profile=DEBUG_FALLBACK
          final_signing_profile=PHYSICAL_DEV_STABLE_LOCAL
          local_signing_required=true
          expected_signer_cert_sha256=e1745e3d3940fc6b03aef0b609d43aa8c436901965966087c2366108ffe263fb
          EOF
          test "$(wc -l <"$ARTIFACT_DIR/BUILD_IDENTITY.txt" | tr -d ' ')" = "24"
          grep -Fxq 'source_branch=wave/15j-physical-device-integration-acceptance' "$ARTIFACT_DIR/BUILD_IDENTITY.txt"
          test "$(sha256sum "$ARTIFACT_DIR/Aurora-W15J-v017r11-TabletLoopback-localDebug-presign.apk" | awk '{print $1}')" = "$PRESIGN_SHA"
          test "$(find "$ARTIFACT_DIR" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          printf 'PRESIGN_APK_SHA256=%s\n' "$PRESIGN_SHA"
          printf 'PROVENANCE_REBIND_ONLY=true\nSOURCE_ARTIFACT_ID=10520682075\n'

      - name: Upload provenance-rebound exact r11 artifact
        uses: actions/upload-artifact@v7
        with:
          name: aurora-w15j-v017r11-presign-apk-fb05c788-host-df17c9f2
          path: /tmp/w15j-tablet-loopback-apk
          if-no-files-found: error
          retention-days: 14
