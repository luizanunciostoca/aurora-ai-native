name: Prototype W15-J Tablet Loopback APK Artifact

on:
  push:
    branches:
      - prototype/w15j-physical-apk-artifact-v017r12
    paths:
      - '.github/workflows/prototype-w15j-physical-apk-artifact.yml'

permissions:
  contents: read

jobs:
  build-exact-w15j-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Assert canonical packaging invocation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF_NAME" = "prototype/w15j-physical-apk-artifact-v017r12"
          test "$GITHUB_SHA" = "$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
      - name: Checkout exact W15-J candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e42ea0650a5056dd0d26e6ac69021691b5625332
          persist-credentials: false
      - name: Assert exact source candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e42ea0650a5056dd0d26e6ac69021691b5625332"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
      - name: Install stable Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Test, assemble and self-bind exact tablet-loopback localDebug candidate
        shell: bash
        env:
          AURORA_ANDROID_SHA: e42ea0650a5056dd0d26e6ac69021691b5625332
          AURORA_HOST_SHA: 790049ae133035db3ed1517b31d9110d7f20d9a4
          AURORA_RELEASE_TUPLE_ID: W15J_DP5_V017R12
          AURORA_LOCAL_GATEWAY_ORIGIN: http://127.0.0.1:8080
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain -p apps/aurora-android \
            :app:testLocalDebugUnitTest \
            :app:assembleLocalDebug

          APK="$(find apps/aurora-android/app/build/outputs/apk/local/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$AAPT"
          BADGING="$($AAPT dump badging "$APK" | sed -n '1p')"
          PACKAGE_ID="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")"
          test "$PACKAGE_ID" = "ai.aurora.device.local"
          test "$VERSION_CODE" = "4"
          test "$VERSION_NAME" = "0.17.0-dev.1-local"

          DEX_STRINGS="$(mktemp)"
          for dex in $(unzip -Z1 "$APK" | grep -E '^classes[0-9]*\.dex$'); do
            unzip -p "$APK" "$dex" | strings >> "$DEX_STRINGS"
          done
          for needle in \
            'aurora.wake.model.v2' \
            'aurora.wake.model.aead.v2' \
            'AES/GCM/NoPadding' \
            'audio.volume.set' \
            '/v1/device/offline/current' \
            'OPEN_VALIDATED_APP' \
            'http://127.0.0.1:8080' \
            'last_evaluation_latency_ms' \
            'wake telemetry never authorizes execution'; do
            if grep -Fq "$needle" "$DEX_STRINGS"; then
              printf 'DEX_ASSERT_PASS=%s\n' "$needle"
            else
              printf 'DEX_ASSERT_FAIL=%s\n' "$needle" >&2
              exit 1
            fi
          done

          ARTIFACT_DIR=/tmp/w15j-tablet-loopback-apk
          mkdir -p "$ARTIFACT_DIR"
          cp "$APK" "$ARTIFACT_DIR/Aurora-W15J-v017r12-TabletLoopback-localDebug-presign.apk"
          (
            cd "$ARTIFACT_DIR"
            sha256sum Aurora-W15J-v017r12-TabletLoopback-localDebug-presign.apk > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

          cat > "$ARTIFACT_DIR/BUILD_IDENTITY.txt" <<EOF
          artifact_purpose=W15-J-DP5-physical-evidence-input
          source_candidate_sha=e42ea0650a5056dd0d26e6ac69021691b5625332
          source_branch=wave/15j-physical-device-integration-acceptance
          paired_local_host_candidate_sha=790049ae133035db3ed1517b31d9110d7f20d9a4
          reconciled_main_parent_sha=77f0f8532197025ee913dd02fcb56878d9d667a9
          packaging_head_sha=${GITHUB_SHA}
          packaging_branch=prototype/w15j-physical-apk-artifact-v017r12
          packaging_run_id=${GITHUB_RUN_ID}
          gateway_environment=LOCAL
          device_gateway_port=8080
          bootstrap_port=8081
          gateway_transport_scope=LOCAL_TABLET_LOOPBACK
          gateway_origin=http://127.0.0.1:8080
          apk_variant=localDebug
          package_id=${PACKAGE_ID}
          version_code=${VERSION_CODE}
          version_name=${VERSION_NAME}
          canonical_acceptance=false
          physical_evidence_required=true
          dp5_status=INCOMPLETE
          input_signing_profile=DEBUG_FALLBACK
          final_signing_profile=PHYSICAL_DEV_STABLE_LOCAL
          local_signing_required=true
          expected_signer_cert_sha256=e1745e3d3940fc6b03aef0b609d43aa8c436901965966087c2366108ffe263fb
          EOF

          test "$(wc -l < "$ARTIFACT_DIR/BUILD_IDENTITY.txt" | tr -d ' ')" = "24"
          grep -Fxq 'gateway_transport_scope=LOCAL_TABLET_LOOPBACK' "$ARTIFACT_DIR/BUILD_IDENTITY.txt"
          grep -Fxq 'gateway_origin=http://127.0.0.1:8080' "$ARTIFACT_DIR/BUILD_IDENTITY.txt"
          test "$(find "$ARTIFACT_DIR" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          printf 'APK_SHA256=%s\n' "$(sha256sum "$ARTIFACT_DIR/Aurora-W15J-v017r12-TabletLoopback-localDebug-presign.apk" | awk '{print $1}')"
      - name: Upload exact W15-J tablet-loopback candidate APK
        uses: actions/upload-artifact@v7
        with:
          name: aurora-w15j-v017r12-presign-apk-e42ea065-host-790049ae
          path: /tmp/w15j-tablet-loopback-apk
          if-no-files-found: error
          retention-days: 14
