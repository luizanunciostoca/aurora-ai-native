name: Prototype W15-J Physical APK Artifact

on:
  push:
    branches:
      - prototype/w15j-physical-apk-artifact
    paths:
      - '.github/workflows/prototype-w15j-physical-apk-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-exact-w15j-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact W15-J candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6c247d2331f4aa4b4cee5455d8658a6fbdad3f4d
          persist-credentials: false
      - name: Assert exact source candidate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "6c247d2331f4aa4b4cee5455d8658a6fbdad3f4d"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
      - name: Install stable Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Test and assemble exact localDebug candidate
        shell: bash
        run: |
          gradle --no-daemon --console=plain -p apps/aurora-android \
            :app:testLocalDebugUnitTest \
            :app:assembleLocalDebug
          APK="$(find apps/aurora-android/app/build/outputs/apk/local/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ARTIFACT_DIR=/tmp/w15j-physical-apk
          mkdir -p "$ARTIFACT_DIR"
          cp "$APK" "$ARTIFACT_DIR/Aurora-W15J-Physical-localDebug.apk"
          (
            cd "$ARTIFACT_DIR"
            sha256sum Aurora-W15J-Physical-localDebug.apk > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          cat > "$ARTIFACT_DIR/BUILD_IDENTITY.txt" <<'EOF'
          artifact_purpose=W15-J-DP5-physical-evidence-input
          source_candidate_sha=6c247d2331f4aa4b4cee5455d8658a6fbdad3f4d
          source_branch=wave/15j-physical-device-integration-acceptance
          apk_variant=localDebug
          package_id=ai.aurora.device.local
          canonical_acceptance=false
          physical_evidence_required=true
          dp5_status=INCOMPLETE
          EOF
      - name: Upload exact W15-J candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-w15j-physical-apk-6c247d23
          path: /tmp/w15j-physical-apk
          if-no-files-found: error
          retention-days: 14
