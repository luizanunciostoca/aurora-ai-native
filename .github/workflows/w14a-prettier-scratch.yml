name: W14-A Exact-Head Focused Validation

on:
  push:
    branches:
      - scratch/w14a-prettier-diagnostic

permissions:
  contents: read

jobs:
  focused-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2631e171c87bb2b966a0a0ca0c1d661cb8d6549f
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Build canonical contracts
        run: npm run build --workspace @aurora/contracts
      - name: Compile exact W14-A focused suite
        run: ./node_modules/.bin/tsc --project services/mobile-gateway/src/gateway-auth/tsconfig.test.json --pretty false
      - name: Run exact W14-A focused suite
        run: node --test services/mobile-gateway/src/gateway-auth/dist-test/test/w14a-gateway-auth-transport.test.js
      - name: Cleanup generated test output
        if: always()
        run: rm -rf services/mobile-gateway/src/gateway-auth/dist-test
