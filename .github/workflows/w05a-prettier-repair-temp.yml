name: W05-A Prettier Repair Temporary

on:
  push:
    branches:
      - wave/05a-task-classifier-v2

permissions:
  contents: write

jobs:
  prettier-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: wave/05a-task-classifier-v2
          fetch-depth: 0

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install canonical workspace
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format only W05-A files
        run: npx prettier --write packages/intelligence/src/classification/classifier.ts packages/intelligence/src/classification/types.ts packages/intelligence/test/w05a-classifier.test.mjs

      - name: Commit formatter-only delta if needed
        shell: bash
        run: |
          if git diff --quiet -- packages/intelligence/src/classification/classifier.ts packages/intelligence/src/classification/types.ts packages/intelligence/test/w05a-classifier.test.mjs; then
            echo 'W05-A files already canonical.'
            exit 0
          fi
          git config user.name 'aurora-program-control'
          git config user.email 'aurora-program-control@users.noreply.github.com'
          git add packages/intelligence/src/classification/classifier.ts packages/intelligence/src/classification/types.ts packages/intelligence/test/w05a-classifier.test.mjs
          git commit -m 'style(W05-A): apply canonical prettier formatting'
          git push origin HEAD:wave/05a-task-classifier-v2
