name: W02-F Canonical Formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'wave/02f-policy-query-precheck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave/02f-policy-query-precheck
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Apply canonical formatting and remove temporary helpers
        run: |
          npx prettier --write \
            packages/policy/src/query/policy-query.test.ts \
            packages/policy/src/query/precheck.ts \
            packages/schemas/src/policy-query/index.ts
          rm -f packages/policy/test/w02f-format-helper.test.ts
          rm -f .github/workflows/w02f-format.yml
      - name: Commit canonical formatting
        run: |
          git config user.name "Aurora W02 Coordinator"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(W02-F): apply canonical formatting and remove helper"
          git push origin HEAD:wave/02f-policy-query-precheck
