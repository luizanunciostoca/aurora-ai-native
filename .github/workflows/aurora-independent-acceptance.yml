name: Aurora Independent Acceptance

on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Candidate pull request number'
        required: true
        type: string
      expected_head_sha:
        description: 'Exact candidate HEAD SHA to review'
        required: true
        type: string
      expected_main_sha:
        description: 'Exact canonical main SHA expected during review'
        required: true
        type: string

permissions: {}

concurrency:
  group: aurora-independent-acceptance-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  validate-request:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.label.name == 'aurora:acceptance-requested'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      expected_head: ${{ steps.resolve.outputs.expected_head }}
      expected_main: ${{ steps.resolve.outputs.expected_main }}
    steps:
      - name: Checkout canonical main governance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Resolve and fail closed on exact refs
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_HEAD: ${{ inputs.expected_head_sha }}
          INPUT_MAIN: ${{ inputs.expected_main_sha }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if test "$EVENT_NAME" = 'workflow_dispatch'; then
            pr_number="$INPUT_PR"
            expected_head="$INPUT_HEAD"
            expected_main="$INPUT_MAIN"
          else
            pr_number="$EVENT_PR"
            expected_head="$EVENT_HEAD"
            expected_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          fi

          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
          [[ "$expected_head" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$expected_main" =~ ^[0-9a-fA-F]{40}$ ]]

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
          live_state="$(jq -r '.state' <<<"$pr_json")"
          live_base="$(jq -r '.base.ref' <<<"$pr_json")"
          live_head="$(jq -r '.head.sha' <<<"$pr_json")"
          live_head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")"
          live_draft="$(jq -r '.draft' <<<"$pr_json")"
          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"

          test "$live_state" = 'open'
          test "$live_base" = 'main'
          test "$live_head_repo" = "$GITHUB_REPOSITORY"
          test "$live_draft" = 'false'
          test "$live_head" = "$expected_head"
          test "$live_main" = "$expected_main"

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "expected_head=$expected_head" >> "$GITHUB_OUTPUT"
          echo "expected_main=$expected_main" >> "$GITHUB_OUTPUT"

  acceptance-review:
    needs: validate-request
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
      copilot-requests: write
    steps:
      - name: Checkout trusted governance at exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate-request.outputs.expected_main }}
          path: governance
          persist-credentials: false
      - name: Checkout candidate exact HEAD as untrusted read-only material
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate-request.outputs.expected_head }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Require deterministic exact-head baseline gates
        id: baseline_gates
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ needs.validate-request.outputs.expected_head }}
          EXPECTED_MAIN: ${{ needs.validate-request.outputs.expected_main }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_HEAD}/check-runs?filter=latest&per_page=100" \
            > /tmp/aurora-check-runs.json

          : > /tmp/aurora-required-check-lines.jsonl
          for required in quality test-build security-gate; do
            count="$(jq --arg required "$required" --arg head "$EXPECTED_HEAD" \
              '[.check_runs[] | select(
                .name == $required and
                .head_sha == $head and
                .app.slug == "github-actions" and
                .status == "completed" and
                .conclusion == "success"
              )] | length' /tmp/aurora-check-runs.json)"
            test "$count" = '1'

            check="$(jq -c --arg required "$required" --arg head "$EXPECTED_HEAD" \
              '.check_runs[] | select(
                .name == $required and
                .head_sha == $head and
                .app.slug == "github-actions" and
                .status == "completed" and
                .conclusion == "success"
              )' /tmp/aurora-check-runs.json)"
            details_url="$(jq -r '.details_url' <<<"$check")"
            if [[ "$details_url" =~ /actions/runs/([0-9]+)(/job/[0-9]+)?$ ]]; then
              run_id="${BASH_REMATCH[1]}"
            else
              exit 1
            fi

            case "$required" in
              quality)
                expected_workflow_path='.github/workflows/quality.yml'
                expected_workflow_name='Quality'
                ;;
              test-build)
                expected_workflow_path='.github/workflows/test-build.yml'
                expected_workflow_name='Test Build'
                ;;
              security-gate)
                expected_workflow_path='.github/workflows/security.yml'
                expected_workflow_name='Security'
                ;;
              *)
                exit 1
                ;;
            esac

            workflow_main_blob="$(
              git -C candidate rev-parse --verify "${EXPECTED_MAIN}:${expected_workflow_path}"
            )"
            workflow_head_blob="$(
              git -C candidate rev-parse --verify "${EXPECTED_HEAD}:${expected_workflow_path}"
            )"
            [[ "$workflow_main_blob" =~ ^[0-9a-f]{40}$ ]]
            [[ "$workflow_head_blob" =~ ^[0-9a-f]{40}$ ]]
            test "$(git -C candidate cat-file -t "$workflow_main_blob")" = 'blob'
            test "$(git -C candidate cat-file -t "$workflow_head_blob")" = 'blob'
            test "$workflow_head_blob" = "$workflow_main_blob"

            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            test "$(jq -r '.head_sha' <<<"$run_json")" = "$EXPECTED_HEAD"
            test "$(jq -r '.event' <<<"$run_json")" = 'pull_request'
            test "$(jq -r '.status' <<<"$run_json")" = 'completed'
            test "$(jq -r '.conclusion' <<<"$run_json")" = 'success'
            test "$(jq -r '.path' <<<"$run_json")" = "$expected_workflow_path"
            test "$(jq -r '.name' <<<"$run_json")" = "$expected_workflow_name"

            jq -n \
              --argjson check "$check" \
              --argjson run "$run_json" \
              --arg workflowMainBlobSha "$workflow_main_blob" \
              --arg workflowHeadBlobSha "$workflow_head_blob" \
              '{
                name: $check.name,
                headSha: $check.head_sha,
                app: $check.app.slug,
                status: $check.status,
                conclusion: $check.conclusion,
                detailsUrl: $check.details_url,
                completedAt: $check.completed_at,
                workflowId: $run.workflow_id,
                workflowPath: $run.path,
                workflowName: $run.name,
                workflowRunId: $run.id,
                workflowEvent: $run.event,
                workflowMainBlobSha: $workflowMainBlobSha,
                workflowHeadBlobSha: $workflowHeadBlobSha
              }' >> /tmp/aurora-required-check-lines.jsonl
          done

          jq -s --arg head "$EXPECTED_HEAD" '{
            schemaVersion: "aurora.required-checks.v1",
            exactHead: $head,
            requiredChecks: sort_by(.name)
          }' /tmp/aurora-required-check-lines.jsonl > /tmp/aurora-required-checks.json

          required_checks_sha256="$(sha256sum /tmp/aurora-required-checks.json | cut -d' ' -f1)"
          [[ "$required_checks_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "required_checks_sha256=$required_checks_sha256" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
      - name: Install pinned Copilot CLI without executing candidate package hooks
        run: |
          npm install --global @github/copilot@1.0.82
          copilot --version > /tmp/aurora-copilot-version.txt
          grep -Fxq 'GitHub Copilot CLI 1.0.82.' /tmp/aurora-copilot-version.txt
      - name: Build bounded static candidate review bundle
        id: review_bundle
        env:
          EXPECTED_HEAD: ${{ needs.validate-request.outputs.expected_head }}
          EXPECTED_MAIN: ${{ needs.validate-request.outputs.expected_main }}
          PR_NUMBER: ${{ needs.validate-request.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          review_dir='governance/.aurora-review-input'
          mkdir -p "$review_dir"

          test "$(git -C governance rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD"
          git -C candidate cat-file -e "${EXPECTED_MAIN}^{commit}"
          git -C candidate cat-file -e "${EXPECTED_HEAD}^{commit}"

          git -C candidate diff \
            --no-ext-diff \
            --no-textconv \
            --binary \
            --full-index \
            "$EXPECTED_MAIN...$EXPECTED_HEAD" \
            > "$review_dir/candidate.patch"

          changed_paths="$(
            git -C candidate diff \
              --no-ext-diff \
              --no-textconv \
              --name-only \
              -z \
              "$EXPECTED_MAIN...$EXPECTED_HEAD" |
              jq -Rs 'split("\u0000") | map(select(length > 0))'
          )"
          changed_count="$(jq 'length' <<<"$changed_paths")"
          patch_bytes="$(wc -c < "$review_dir/candidate.patch")"
          test "$changed_count" -ge 1
          test "$changed_count" -le 2000
          test "$patch_bytes" -ge 1
          test "$patch_bytes" -le 8000000

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson prNumber "$PR_NUMBER" \
            --arg exactHead "$EXPECTED_HEAD" \
            --arg exactMain "$EXPECTED_MAIN" \
            --argjson changedPaths "$changed_paths" \
            --argjson patchBytes "$patch_bytes" \
            '{
              schemaVersion: "aurora.static-review-input.v1",
              repository: $repository,
              prNumber: $prNumber,
              exactHead: $exactHead,
              exactMain: $exactMain,
              changedPaths: $changedPaths,
              patchBytes: $patchBytes
            }' > "$review_dir/review-metadata.json"

          (
            cd "$review_dir"
            sha256sum candidate.patch review-metadata.json > SHA256SUMS
          )
          manifest_sha256="$(sha256sum "$review_dir/SHA256SUMS" | cut -d' ' -f1)"
          [[ "$manifest_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"

          find "$review_dir" -type f -exec chmod 0444 {} +
          chmod 0555 "$review_dir"
      - name: Render governed independent acceptance prompt from trusted main
        run: >-
          node governance/tools/copilot/acceptance-review-prompt.mjs
          '${{ needs.validate-request.outputs.pr_number }}'
          '${{ needs.validate-request.outputs.expected_head }}'
          '${{ needs.validate-request.outputs.expected_main }}'
          '${{ github.repository }}'
          > /tmp/aurora-acceptance-prompt.txt
      - name: Run independent acceptance agent from trusted governance checkout
        id: acceptance
        working-directory: governance
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          env \
            -u GITHUB_ENV \
            -u GITHUB_OUTPUT \
            -u GITHUB_PATH \
            -u GITHUB_STEP_SUMMARY \
            -u GITHUB_STATE \
            copilot \
            --agent='aurora-acceptance' \
            --model=auto \
            --mode=autopilot \
            --max-autopilot-continues=8 \
            --allow-all-tools \
            --excluded-tools shell task edit create str_replace_editor apply_patch \
            --deny-tool shell write task \
            --disallow-temp-dir \
            --no-bash-env \
            --no-ask-user \
            --no-auto-update \
            --no-remote \
            --no-remote-export \
            --stream=off \
            -p "$(cat /tmp/aurora-acceptance-prompt.txt)" \
            > /tmp/aurora-acceptance-output.txt 2>&1
          status=$?
          set -e
          test "$status" = '0'
      - name: Prove reviewer did not mutate exact inputs or either checkout
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-request.outputs.pr_number }}
          EXPECTED_HEAD: ${{ needs.validate-request.outputs.expected_head }}
          EXPECTED_MAIN: ${{ needs.validate-request.outputs.expected_main }}
          REQUIRED_CHECKS_SHA256: ${{ steps.baseline_gates.outputs.required_checks_sha256 }}
          REVIEW_MANIFEST_SHA256: ${{ steps.review_bundle.outputs.manifest_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUIRED_CHECKS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$REVIEW_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum /tmp/aurora-required-checks.json | cut -d' ' -f1)" = "$REQUIRED_CHECKS_SHA256"
          test "$(sha256sum governance/.aurora-review-input/SHA256SUMS | cut -d' ' -f1)" = "$REVIEW_MANIFEST_SHA256"
          (
            cd governance/.aurora-review-input
            sha256sum --check --strict SHA256SUMS
          )
          test "$(git -C governance status --porcelain --untracked-files=normal)" = '?? .aurora-review-input/'
          test -z "$(git -C candidate status --porcelain --untracked-files=all)"

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.state' <<<"$pr_json")" = 'open'
          test "$(jq -r '.base.ref' <<<"$pr_json")" = 'main'
          test "$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.draft' <<<"$pr_json")" = 'false'
          test "$(jq -r '.head.sha' <<<"$pr_json")" = "$EXPECTED_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_MAIN"

          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_HEAD}/check-runs?filter=latest&per_page=100" \
            > /tmp/aurora-current-check-runs.json
          for required in quality test-build security-gate; do
            evidence_details_url="$(
              jq -r --arg required "$required" \
                '.requiredChecks[] | select(.name == $required) | .detailsUrl' \
                /tmp/aurora-required-checks.json
            )"
            current_count="$(
              jq --arg required "$required" \
                --arg head "$EXPECTED_HEAD" \
                --arg details "$evidence_details_url" \
                '[.check_runs[] | select(
                  .name == $required and
                  .head_sha == $head and
                  .app.slug == "github-actions" and
                  .status == "completed" and
                  .conclusion == "success" and
                  .details_url == $details
                )] | length' /tmp/aurora-current-check-runs.json
            )"
            test "$current_count" = '1'
          done
      - name: Validate machine-readable exact-head decision with trusted validator
        shell: bash
        run: >-
          node governance/tools/copilot/validate-acceptance-output.mjs
          /tmp/aurora-acceptance-output.txt
          '${{ needs.validate-request.outputs.expected_head }}'
          '${{ needs.validate-request.outputs.expected_main }}'
          '${{ needs.validate-request.outputs.pr_number }}'
          '${{ github.repository }}'
          /tmp/aurora-required-checks.json
          > /tmp/aurora-acceptance-result.json
      - name: Build immutable acceptance evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aurora-acceptance-artifact
          cp /tmp/aurora-acceptance-output.txt /tmp/aurora-acceptance-artifact/acceptance-output.txt
          cp /tmp/aurora-acceptance-result.json /tmp/aurora-acceptance-artifact/acceptance-result.json
          cp /tmp/aurora-required-checks.json /tmp/aurora-acceptance-artifact/required-checks.json
          cp /tmp/aurora-copilot-version.txt /tmp/aurora-acceptance-artifact/copilot-version.txt
          printf '%s\n' '${{ needs.validate-request.outputs.expected_head }}' > /tmp/aurora-acceptance-artifact/exact-head.txt
          printf '%s\n' '${{ needs.validate-request.outputs.expected_main }}' > /tmp/aurora-acceptance-artifact/exact-main.txt
      - name: Upload independent acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aurora-acceptance-pr-${{ needs.validate-request.outputs.pr_number }}-${{ github.run_id }}
          path: /tmp/aurora-acceptance-artifact
          if-no-files-found: error
          retention-days: 30

  publish-evidence:
    needs: [validate-request, acceptance-review]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Download exact acceptance artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: aurora-acceptance-pr-${{ needs.validate-request.outputs.pr_number }}-${{ github.run_id }}
          path: /tmp/aurora-acceptance-artifact
      - name: Revalidate exact HEAD and main before evidence publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ needs.validate-request.outputs.pr_number }}")"
          live_state="$(jq -r '.state' <<<"$pr_json")"
          live_base="$(jq -r '.base.ref' <<<"$pr_json")"
          live_head="$(jq -r '.head.sha' <<<"$pr_json")"
          live_head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")"
          live_draft="$(jq -r '.draft' <<<"$pr_json")"
          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$live_state" = 'open'
          test "$live_base" = 'main'
          test "$live_head_repo" = "$GITHUB_REPOSITORY"
          test "$live_draft" = 'false'
          test "$live_head" = '${{ needs.validate-request.outputs.expected_head }}'
          test "$live_main" = '${{ needs.validate-request.outputs.expected_main }}'
      - name: Publish evidence-only independent decision safely
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate-request.outputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXPECTED_HEAD: ${{ needs.validate-request.outputs.expected_head }}
          EXPECTED_MAIN: ${{ needs.validate-request.outputs.expected_main }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(cat /tmp/aurora-acceptance-artifact/acceptance-result.json)"
          result_repository="$(jq -r '.repository' <<<"$result")"
          result_pr="$(jq -r '.prNumber' <<<"$result")"
          decision="$(jq -r '.decision' <<<"$result")"
          summary="$(jq -r '.summary' <<<"$result")"
          blockers="$(jq -c '.blockers' <<<"$result")"
          gates="$(jq -c '.riskGates' <<<"$result")"
          required_checks="$(jq -c '.requiredChecks' <<<"$result")"
          test "$result_repository" = "$GITHUB_REPOSITORY"
          test "$result_pr" = "$PR_NUMBER"
          {
            printf '%s\n\n' 'AURORA INDEPENDENT ACCEPTANCE EVIDENCE — github-actions[bot]'
            printf 'Repository: %s\n' "$result_repository"
            printf 'Candidate PR: #%s\n' "$result_pr"
            printf 'Exact candidate HEAD: %s\n' "$EXPECTED_HEAD"
            printf 'Exact canonical main: %s\n' "$EXPECTED_MAIN"
            printf '%s\n' 'Independent agent: aurora-acceptance'
            printf 'Decision: %s\n' "$decision"
            printf 'Risk Gates: %s\n' "$gates"
            printf 'Required exact-head checks: %s\n' "$required_checks"
            printf 'Blockers: %s\n' "$blockers"
            printf 'Summary: %s\n' "$summary"
            printf 'Workflow evidence: %s\n\n' "$RUN_URL"
            printf '%s\n' 'This is exact-head independent acceptance evidence only. This workflow cannot edit candidate code, apply aurora:accepted, close task issues or merge the PR. Any later controlled merge must independently revalidate HEAD/main and follow canonical post-merge/Drive convergence rules.'
          } > /tmp/aurora-acceptance-comment.txt
          gh pr comment "$PR_NUMBER" --body-file /tmp/aurora-acceptance-comment.txt
