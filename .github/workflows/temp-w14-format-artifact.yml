name: TEMP W14 Atomic Format Cleanup

on:
  pull_request:
    paths:
      - '.github/workflows/temp-w14-format-artifact.yml'

permissions:
  contents: write

jobs:
  atomic-cleanup:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact W14 writer head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Apply canonical Prettier and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            services/mobile-gateway/src/gateway-auth/device-key-proof-verifier.ts \
            services/mobile-gateway/src/gateway-auth/device-plane-network.ts \
            services/mobile-gateway/src/gateway-auth/test/w14-device-plane-network.test.ts
          rm -f services/mobile-gateway/src/gateway-auth/test/w14-device-plane-prettier-diagnostic.test.ts
          rm -f .github/workflows/temp-w14-format-artifact.yml
      - name: Commit only if writer head is unchanged
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            services/mobile-gateway/src/gateway-auth/device-key-proof-verifier.ts \
            services/mobile-gateway/src/gateway-auth/device-plane-network.ts \
            services/mobile-gateway/src/gateway-auth/test/w14-device-plane-network.test.ts \
            services/mobile-gateway/src/gateway-auth/test/w14-device-plane-prettier-diagnostic.test.ts \
            .github/workflows/temp-w14-format-artifact.yml
          git diff --cached --check
          git commit -m 'chore(W14): apply canonical formatter cleanup'
          git push origin "HEAD:refs/heads/$BRANCH"
