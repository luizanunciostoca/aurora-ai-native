name: Temporary W15-J Strict Cleanup

on:
  push:
    branches:
      - wave/15j-real-local-physical-host-clean
    paths:
      - '.github/workflows/prototype-w15j-strict-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave/15j-real-local-physical-host-clean
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Apply exact strict-source remediations
        run: |
          node <<'NODE'
          const fs = require('fs');

          const host = 'services/mobile-gateway/src/physical-host/local-physical-host.ts';
          let s = fs.readFileSync(host, 'utf8');
          s = s.replace(
            "import { GatewayBootstrapDeliveryBroker } from '../gateway-auth/gateway-bootstrap-delivery.js';",
            "import {\n  GatewayBootstrapDeliveryBroker,\n  type GatewayBootstrapStageResult,\n} from '../gateway-auth/gateway-bootstrap-delivery.js';",
          );
          s = s.replace(
            "  type AuthenticatedGatewayBootstrapPrincipal,\n  type GatewayBootstrapStageResult,\n} from '../gateway-auth/gateway-bootstrap.js';",
            "  type AuthenticatedGatewayBootstrapPrincipal,\n} from '../gateway-auth/gateway-bootstrap.js';",
          );
          fs.writeFileSync(host, s);

          const w03 = 'services/mobile-gateway/src/physical-host/w03-postgres-reservations.ts';
          s = fs.readFileSync(w03, 'utf8');
          s = s.replace(
            "import { createHash } from 'node:crypto';\n",
            "import { createHash } from 'node:crypto';\n// @ts-expect-error -- Aurora targets Node 22 runtime built-ins without repository-wide @types/node.\nimport { env as processEnv } from 'node:process';\n",
          );
          s = s.replace(
            "env: { ...process.env, PGDATABASE: this.#databaseUrl },",
            "env: { ...processEnv, PGDATABASE: this.#databaseUrl },",
          );
          s = s.replace(
            "    const malformed = receiptMalformed(request);\n    if (malformed !== null) return malformed;\n    const key = receiptKey(request.receiptId);",
            "    const malformed = receiptMalformed(request);\n    if (malformed !== null) {\n      return { ok: false, code: 'MALFORMED', retryable: false, authorizesExecution: false };\n    }\n    const key = receiptKey(request.receiptId);",
          );
          fs.writeFileSync(w03, s);

          const tsconfig = 'services/mobile-gateway/src/physical-host/tsconfig.json';
          const config = JSON.parse(fs.readFileSync(tsconfig, 'utf8'));
          config.include = ['*.ts'];
          fs.writeFileSync(tsconfig, `${JSON.stringify(config, null, 2)}\n`);
          NODE
      - name: Apply canonical Prettier
        run: npx prettier --write services/executors/src/device-dispatch/governed-device-dispatch.ts services/executors/test/w15j-governed-device-dispatch.test.ts services/mobile-gateway/src/physical-host/governed-device-dispatch.ts services/mobile-gateway/src/physical-host/test/governed-device-dispatch.test.ts services/mobile-gateway/src/physical-host/local-physical-host.ts services/mobile-gateway/src/physical-host/w03-postgres-reservations.ts services/mobile-gateway/src/physical-host/tsconfig.json
      - name: Remove temporary workflow and commit cleanup
        run: |
          rm .github/workflows/prototype-w15j-strict-cleanup.yml
          git config user.name "aurora-control-tower"
          git config user.email "actions@users.noreply.github.com"
          git add services/executors/src/device-dispatch/governed-device-dispatch.ts services/executors/test/w15j-governed-device-dispatch.test.ts services/mobile-gateway/src/physical-host/governed-device-dispatch.ts services/mobile-gateway/src/physical-host/test/governed-device-dispatch.test.ts services/mobile-gateway/src/physical-host/local-physical-host.ts services/mobile-gateway/src/physical-host/w03-postgres-reservations.ts services/mobile-gateway/src/physical-host/tsconfig.json .github/workflows/prototype-w15j-strict-cleanup.yml
          git diff --cached --check
          git commit -m "fix(W15-J): close strict physical host blockers"
          git push origin HEAD:wave/15j-real-local-physical-host-clean
