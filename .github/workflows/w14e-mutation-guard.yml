name: W14-E Mutation Guard Scratch

on:
  push:
    branches:
      - scratch/w14e-mutation-guard

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Apply mutation-order guard
        env:
          OLD_B64: 
          NEW_B64: 
          ADD_B64: 
        run: |
          python3 -c "import base64,os; from pathlib import Path; p=Path('services/mobile-gateway/src/device-session/session-trust.ts'); t=p.read_text(); old=base64.b64decode(os.environ['OLD_B64']).decode(); new=base64.b64decode(os.environ['NEW_B64']).decode(); assert old in t; p.write_text(t.replace(old,new,1)); q=Path('services/mobile-gateway/test/w14e-device-session-trust.test.ts'); s=q.read_text(); a=base64.b64decode(os.environ['ADD_B64']).decode(); assert 'invalid open request cannot evict remembered revoked trust state' not in s; q.write_text(s+a)"
          npx prettier --write services/mobile-gateway/src/device-session/session-trust.ts services/mobile-gateway/test/w14e-device-session-trust.test.ts
      - name: Commit guarded blobs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/mobile-gateway/src/device-session/session-trust.ts services/mobile-gateway/test/w14e-device-session-trust.test.ts
          git commit -m 'fix(W14-E): validate before retention mutation'
          git push
