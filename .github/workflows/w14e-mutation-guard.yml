name: W14-E Mutation Guard Scratch

on:
  push:
    branches:
      - scratch/w14e-mutation-guard

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Move capacity mutation after trust validation and add regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('services/mobile-gateway/src/device-session/session-trust.ts')
          text = source.read_text()
          old = """    const capacity = this.#prepareSessionSlot();
    if (capacity !== null) return capacity;
    const bindingError = this.#validateGatewayDeviceBinding(
      parsed.value.gatewaySession,
      parsed.value.deviceRecord,
      parsed.value.nowMs,
    );
    if (bindingError !== null) return bindingError;
    const attestationError = this.#validateAttestation(
      parsed.value.attestation,
      parsed.value.nowMs,
    );
    if (attestationError !== null) return attestationError;
"""
          new = """    const bindingError = this.#validateGatewayDeviceBinding(
      parsed.value.gatewaySession,
      parsed.value.deviceRecord,
      parsed.value.nowMs,
    );
    if (bindingError !== null) return bindingError;
    const attestationError = this.#validateAttestation(
      parsed.value.attestation,
      parsed.value.nowMs,
    );
    if (attestationError !== null) return attestationError;
    const capacity = this.#prepareSessionSlot();
    if (capacity !== null) return capacity;
"""
          if old not in text:
              raise SystemExit('expected openSession block not found')
          source.write_text(text.replace(old, new, 1))

          test = Path('services/mobile-gateway/test/w14e-device-session-trust.test.ts')
          test_text = test.read_text()
          addition = r'''

test('invalid open request cannot evict remembered revoked trust state', () => {
  const target = manager({ maxActiveSessions: 2, maxRememberedSessions: 2 });
  assert.equal(open(target).ok, true);
  assert.equal(
    target.revokeSession({
      deviceSessionId: 'device-session:1',
      connectionId: 'gateway:connection:1',
      revokedAtMs: 10_100,
      reasonReference: 'revocation:retention-guard',
    }).ok,
    true,
  );
  assert.equal(
    open(target, {
      deviceSessionId: 'device-session:2',
      gatewaySession: gateway({
        sessionId: 'gateway:session:2',
        connectionId: 'gateway:connection:2',
      }),
    }).ok,
    true,
  );

  assert.equal(
    errorCode(
      open(target, {
        deviceSessionId: 'device-session:3',
        gatewaySession: gateway({
          sessionId: 'gateway:session:3',
          connectionId: 'gateway:connection:3',
          tenantId: TENANT_B,
        }),
      }),
    ),
    'TENANT_MISMATCH',
  );

  assert.equal(
    errorCode(
      open(target, {
        deviceSessionId: 'device-session:1',
        gatewaySession: gateway({
          sessionId: 'gateway:session:4',
          connectionId: 'gateway:connection:4',
        }),
      }),
    ),
    'SESSION_CONFLICT',
  );
});
'''
          marker = "invalid open request cannot evict remembered revoked trust state"
          if marker in test_text:
              raise SystemExit('regression test already present')
          test.write_text(test_text + addition)
          PY
          npx prettier --write services/mobile-gateway/src/device-session/session-trust.ts services/mobile-gateway/test/w14e-device-session-trust.test.ts
      - name: Commit guarded blobs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/mobile-gateway/src/device-session/session-trust.ts services/mobile-gateway/test/w14e-device-session-trust.test.ts
          git commit -m 'fix(W14-E): validate before retention mutation'
          git push
