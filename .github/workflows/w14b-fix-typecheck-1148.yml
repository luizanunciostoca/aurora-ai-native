name: W14-B Typecheck Fix Scratch

on:
  push:
    branches:
      - scratch/w14b-fix-typecheck-1148

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: ${{ !contains(github.event.head_commit.message, 'validated typecheck fix') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout scratch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - name: Apply exact W14-B fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          manager = Path('services/mobile-gateway/src/realtime-session/manager.ts')
          text = manager.read_text()
          old = '    existing.closedAtMs = undefined;'
          assert text.count(old) == 1
          manager.write_text(text.replace(old, '    delete existing.closedAtMs;'))

          config_path = Path('services/mobile-gateway/src/realtime-session/tsconfig.json')
          config = json.loads(config_path.read_text())
          paths = config['compilerOptions']['paths']
          paths['@aurora/contracts/context'] = ['../../../../packages/contracts/src/context/index.ts']
          config_path.write_text(json.dumps(config, indent=2) + '\n')
          PY
      - name: Install locked dependencies
        run: npm ci
      - name: Format exact patched files with canonical Prettier
        run: npx prettier --write services/mobile-gateway/src/realtime-session/manager.ts services/mobile-gateway/src/realtime-session/tsconfig.json
      - name: Build canonical contracts dependency
        run: npm run build --workspace @aurora/contracts
      - name: Build W14-B source
        run: ./node_modules/.bin/tsc --project services/mobile-gateway/src/realtime-session/tsconfig.build.json --pretty false
      - name: Compile W14-B focused tests
        run: ./node_modules/.bin/tsc --project services/mobile-gateway/src/realtime-session/tsconfig.test.json --pretty false
      - name: Execute W14-B focused tests
        run: node --test services/mobile-gateway/src/realtime-session/dist-test/realtime-session/test/w14b-realtime-command-session.test.js
      - name: Cleanup generated output
        run: rm -rf services/mobile-gateway/src/realtime-session/dist services/mobile-gateway/src/realtime-session/dist-test packages/contracts/dist
      - name: Prove exact patch scope
        run: |
          git diff --name-only
          test "$(git diff --name-only | grep -Ev '^(services/mobile-gateway/src/realtime-session/(manager.ts|tsconfig.json))$' | wc -l)" -eq 0
      - name: Commit validated fix on scratch only
        run: |
          git config user.name 'Idebook Digital'
          git config user.email 'luizanunciostoca@gmail.com'
          git add services/mobile-gateway/src/realtime-session/manager.ts services/mobile-gateway/src/realtime-session/tsconfig.json
          git commit -m 'fix(W14-B): validated typecheck fix'
          git push origin HEAD:scratch/w14b-fix-typecheck-1148
