name: TEMP Copilot Fabric Formatter

on:
  pull_request:
    paths:
      - '.github/ISSUE_TEMPLATE/aurora_copilot_task.yml'
      - 'docs/governance/copilot/tasks/**'
      - 'tools/copilot/**'
      - '.github/workflows/temp-copilot-fabric-format.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/copilot-multi-agent-fabric-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply canonical formatter
        run: npx prettier --write .github/ISSUE_TEMPLATE/aurora_copilot_task.yml docs/governance/copilot/tasks/W*.json tools/copilot/*.mjs
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/ISSUE_TEMPLATE/aurora_copilot_task.yml docs/governance/copilot/tasks/W*.json tools/copilot/*.mjs
          git commit -m 'style(copilot): apply canonical formatting'
          git push origin HEAD:${{ github.head_ref }}
