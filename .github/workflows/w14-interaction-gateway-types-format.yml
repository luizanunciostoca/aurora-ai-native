name: W14 Interaction Gateway Types Format

on:
  push:
    branches:
      - prebuild/w14-v017-interaction-gateway-adapter

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Format only interaction gateway types
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write services/mobile-gateway/src/interaction-gateway/types.ts
          git diff --check
          git add services/mobile-gateway/src/interaction-gateway/types.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(W14): format interaction gateway types'
          git push origin HEAD:prebuild/w14-v017-interaction-gateway-adapter
