name: W09F Prettier Temp
on:
  push:
    branches:
      - scratch/w09f-prettier-clean
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Canonical Prettier 3.9.6
        run: npx --yes prettier@3.9.6 --write services/n8n-bridge/test/w09f-governance-replay-failure-integration.test.ts
      - name: Publish formatted permanent file only
        run: |
          if git diff --quiet -- services/n8n-bridge/test/w09f-governance-replay-failure-integration.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/n8n-bridge/test/w09f-governance-replay-failure-integration.test.ts
          git commit -m "chore(w09): canonical prettier 3.9.6 output"
          git push
