name: Quality

on:
  pull_request:
  push:
    branches: [main, wave/07g-w03-half-open-lease]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Apply canonical Prettier and self-clean
        run: |
          npx prettier --write services/mobile-gateway/src/physical-host/test/w03-half-open-probe-lease.test.ts services/mobile-gateway/src/physical-host/w03-half-open-probe-lease.ts tools/test/tsconfig.w15j-composition.json
          cat > .github/workflows/quality.yml <<'EOF'
          name: Quality

          on:
            pull_request:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            quality:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                  with:
                    persist-credentials: false
                - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
                  with:
                    node-version: 22.16.0
                    cache: npm
                - run: npm ci
                - run: npm run format:check
                - run: npm run lint
                - run: npm run typecheck
                - run: npm run quality
          EOF
          npm run format:check
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/mobile-gateway/src/physical-host/test/w03-half-open-probe-lease.test.ts services/mobile-gateway/src/physical-host/w03-half-open-probe-lease.ts tools/test/tsconfig.w15j-composition.json .github/workflows/quality.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(W07-G): apply canonical formatting and remove diagnostic"
          git push origin HEAD:wave/07g-w03-half-open-lease
