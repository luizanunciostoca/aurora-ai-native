name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Diagnostic canonical Prettier diff
        run: |
          npx prettier --write services/mobile-gateway/src/physical-host/test/w03-half-open-probe-lease.test.ts services/mobile-gateway/src/physical-host/w03-half-open-probe-lease.ts tools/test/tsconfig.w15j-composition.json
          git --no-pager diff -- services/mobile-gateway/src/physical-host/test/w03-half-open-probe-lease.test.ts services/mobile-gateway/src/physical-host/w03-half-open-probe-lease.ts tools/test/tsconfig.w15j-composition.json
          git checkout -- services/mobile-gateway/src/physical-host/test/w03-half-open-probe-lease.test.ts services/mobile-gateway/src/physical-host/w03-half-open-probe-lease.ts tools/test/tsconfig.w15j-composition.json
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run quality
