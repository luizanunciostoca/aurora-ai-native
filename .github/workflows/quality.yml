name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Temporary W15-G Prettier diagnostic
        run: |
          npx prettier --write services/mobile-gateway/src/gateway-auth/test/w15g-w07-voice-candidate-network.test.ts
          git diff -- services/mobile-gateway/src/gateway-auth/test/w15g-w07-voice-candidate-network.test.ts
          git checkout -- services/mobile-gateway/src/gateway-auth/test/w15g-w07-voice-candidate-network.test.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run quality
