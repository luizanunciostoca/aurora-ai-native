name: Temporary W15-J Receipt Formatter

on:
  push:
    branches:
      - wave/15j-real-local-physical-host-clean
    paths:
      - '.github/workflows/prototype-w15j-receipt-format.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npx prettier --write services/executors/src/readback/device-receipt-observer.ts services/executors/test/w15j-device-receipt-observer.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: w15j-receipt-adapter-formatted
          path: |
            services/executors/src/readback/device-receipt-observer.ts
            services/executors/test/w15j-device-receipt-observer.test.ts
          if-no-files-found: error
          retention-days: 1
