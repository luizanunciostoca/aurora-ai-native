name: W10-D Temporary Acceptance Hardening

on:
  push:
    branches:
      - wave/10d-nurture-sales-customer-success

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave/10d-nurture-sales-customer-success
      - name: Decode and apply exact fail-closed hardening
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/w10d_harden.py
          python /tmp/w10d_harden.py
      - name: Setup canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Canonical format targeted W10-D files
        run: |
          ./node_modules/.bin/prettier --write \
            packages/revenue/src/flows/types.ts \
            packages/revenue/src/flows/controller.ts \
            packages/revenue/test/w10d-revenue-flows.test.ts
      - name: Validate canonical quality and tests before commit
        run: npm run lint && npm run typecheck && npm test && npm run build && npm run audit:cleanup
      - name: Commit acceptance hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/revenue/src/flows/types.ts packages/revenue/src/flows/controller.ts packages/revenue/test/w10d-revenue-flows.test.ts
          git commit -m "security(W10-D): fail closed on forged flow evidence"
          git push origin HEAD:wave/10d-nurture-sales-customer-success