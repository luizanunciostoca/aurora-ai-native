name: Aurora Copilot Task Orchestrator

on:
  push:
    branches: [main]
    paths:
      - 'docs/governance/copilot/**'
      - 'tools/copilot/**'
      - '.github/agents/**'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
      - 'AGENTS.md'
  issues:
    types: [closed, reopened]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: aurora-puzzle-program-orchestrator
  cancel-in-progress: false

jobs:
  validate-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate 166-task Aurora Puzzle DAG
        run: node tools/copilot/load-task-graph.mjs
      - name: Validate Puzzle execution mode
        run: node tools/copilot/validate-execution-mode.mjs
      - name: Validate Puzzle scheduling policy
        run: node tools/copilot/puzzle-policy.test.mjs
      - name: Validate PREBUILD artifact authority boundary
        run: node tools/copilot/puzzle-prebuild-artifact.test.mjs

  materialize-puzzle-frontier:
    needs: validate-graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Materialize canonical BUILD and logical Puzzle lanes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/copilot/materialize-ready.mjs
