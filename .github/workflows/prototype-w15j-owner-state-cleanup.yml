name: Temporary W15-J Owner State Cleanup

on:
  push:
    branches:
      - wave/15j-real-local-physical-host-clean
    paths:
      - '.github/workflows/prototype-w15j-owner-state-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Apply exact typecheck remediations
        run: |
          node <<'NODE'
          const fs = require('fs');
          {
            const p = 'services/executors/src/voice-intake/dispatching-intake.ts';
            let s = fs.readFileSync(p, 'utf8');
            const from = `    const actionIntent = evaluated.resolved.actionIntent;\n    const evaluatedAt = evaluated.resolved.authorityEvaluation.policyEvaluation.evaluatedAt;`;
            const to = `    const resolved = evaluated.resolved;\n    if (resolved === undefined) {\n      return resultWithDispatch(\n        evaluated.result,\n        observation('NOT_ATTEMPTED_STATE_UNAVAILABLE'),\n      );\n    }\n    const actionIntent = resolved.actionIntent;\n    const evaluatedAt = resolved.authorityEvaluation.policyEvaluation.evaluatedAt;`;
            if (!s.includes(from)) throw new Error('dispatching-intake narrowing target not found');
            s = s.replace(from, to);
            fs.writeFileSync(p, s);
          }
          {
            const p = 'services/executors/test/w15j-dispatching-voice-intake.test.ts';
            let s = fs.readFileSync(p, 'utf8');
            const from = `        killSwitch: { state: 'ACTIVE', changedAt: '2026-09-05T19:20:00.000Z' },`;
            const to = `        killSwitch: {\n          state: 'ACTIVE',\n          changedAt:\n            '2026-09-05T19:20:00.000Z' as TrustedVoiceExecutionState['containment']['killSwitch']['changedAt'],\n        },`;
            if (!s.includes(from)) throw new Error('branded timestamp target not found');
            s = s.replace(from, to);
            fs.writeFileSync(p, s);
          }
          NODE
      - name: Apply canonical Prettier to new W15-J surfaces
        run: |
          npx prettier --write \
            services/executors/src/voice-intake/dispatching-intake.ts \
            services/executors/src/voice-intake/intake.ts \
            services/executors/src/voice-intake/owner-backed-execution-state-source.ts \
            services/executors/test/w15j-dispatching-voice-intake.test.ts \
            services/executors/test/w15j-owner-backed-execution-state-source.test.ts
      - name: Prove repository tests before commit
        run: npm test
      - name: Remove temporary workflow and commit exact cleanup
        run: |
          rm .github/workflows/prototype-w15j-owner-state-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/executors/src/voice-intake/dispatching-intake.ts \
            services/executors/src/voice-intake/intake.ts \
            services/executors/src/voice-intake/owner-backed-execution-state-source.ts \
            services/executors/test/w15j-dispatching-voice-intake.test.ts \
            services/executors/test/w15j-owner-backed-execution-state-source.test.ts \
            .github/workflows/prototype-w15j-owner-state-cleanup.yml
          git commit -m 'fix(W15-J): harden owner-backed voice execution composition'
          git push origin HEAD:wave/15j-real-local-physical-host-clean
