name: W09-C Scratch Format

on:
  push:
    branches:
      - scratch/w09c-canonical-format

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npx prettier --write services/n8n-bridge/src/credentials/resolver.ts services/n8n-bridge/src/credentials/types.ts services/n8n-bridge/test/w09c-workflow-credential-boundary.test.ts
      - run: git diff --check
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/n8n-bridge/src/credentials/resolver.ts services/n8n-bridge/src/credentials/types.ts services/n8n-bridge/test/w09c-workflow-credential-boundary.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(W09-C): apply canonical formatting"
          git push
