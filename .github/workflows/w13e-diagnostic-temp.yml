name: W13E Diagnostic Temp

on:
  push:
    branches:
      - wave/13e-governed-paused-first-operations

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Canonical prettier output
        run: >-
          npx prettier --write
          packages/revenue/src/google-ads/governed-operations.ts
          packages/revenue/test/w13e-governed-paused-first-operations.test.ts
      - name: Capture tests
        shell: bash
        run: |
          set +e
          npm test > w13e-test.log 2>&1
          status=$?
          echo "$status" > w13e-test-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: w13e-diagnostic
          path: |
            packages/revenue/src/google-ads/governed-operations.ts
            packages/revenue/test/w13e-governed-paused-first-operations.test.ts
            w13e-test.log
            w13e-test-exit.txt
          if-no-files-found: error
