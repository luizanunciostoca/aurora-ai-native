name: W13E Diagnostic Temp

on:
  push:
    branches:
      - wave/13e-governed-paused-first-operations

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fix exact optional fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/revenue/test/w13e-governed-paused-first-operations.test.ts')
          text = path.read_text()
          old = '      managerCustomerId: plan.managerCustomerId,\n'
          new = '      ...(plan.managerCustomerId ? { managerCustomerId: plan.managerCustomerId } : {}),\n'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Canonical prettier output
        run: >-
          npx prettier --write
          packages/revenue/src/google-ads/governed-operations.ts
          packages/revenue/test/w13e-governed-paused-first-operations.test.ts
      - name: Validate test suite before publishing repair
        run: npm test
      - name: Publish only repaired W13-E files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/revenue/src/google-ads/governed-operations.ts packages/revenue/test/w13e-governed-paused-first-operations.test.ts
          if git diff --cached --quiet; then
            echo 'No W13-E repair changes to publish.'
            exit 0
          fi
          git commit -m 'fix(w13): format governed operations and omit absent optional MCC'
          git push origin HEAD:wave/13e-governed-paused-first-operations
