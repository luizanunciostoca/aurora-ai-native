name: W14-G Temporary Formatter

on:
  push:
    branches:
      - wave/14g-session-revoke-receipt-ingress

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave/14g-session-revoke-receipt-ingress
          persist-credentials: true
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install canonical workspace
        run: npm ci
      - name: Apply repository Prettier
        run: >-
          ./node_modules/.bin/prettier --write
          services/mobile-gateway/src/device-receipt-ingress/manager.ts
          services/mobile-gateway/src/device-receipt-ingress/types.ts
          services/mobile-gateway/src/device-receipt-ingress/test/w14g-device-receipt-ingress.test.ts
      - name: Commit exact formatting
        run: |
          if git diff --quiet -- services/mobile-gateway/src/device-receipt-ingress; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/mobile-gateway/src/device-receipt-ingress/manager.ts \
                  services/mobile-gateway/src/device-receipt-ingress/types.ts \
                  services/mobile-gateway/src/device-receipt-ingress/test/w14g-device-receipt-ingress.test.ts
          git commit -m "style(W14-G): apply canonical prettier formatting"
          git push origin HEAD:wave/14g-session-revoke-receipt-ingress
