name: W03-E Lock Reconcile Temp

on:
  push:
    branches:
      - wave/03e-timers-leases-workflow-fallback

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wave/03e-timers-leases-workflow-fallback
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Reconcile canonical npm lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Assert Program Control scope
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "package-lock.json"
          grep -q 'node_modules/@aurora/workflow' package-lock.json
          grep -q '"packages/workflow"' package-lock.json
      - name: Publish lock reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(program-control): reconcile W03-E workspace lock'
          git push origin HEAD:wave/03e-timers-leases-workflow-fallback
