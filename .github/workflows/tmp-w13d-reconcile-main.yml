name: Temporary W13-D Main Reconciliation

on:
  push:
    branches:
      - wave/13d-google-ads-asset-planning

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Merge live main and self-remove reconciliation workflow
        run: |
          git config user.name "aurora-program-control"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/tmp-w13d-reconcile-main.yml
          git commit -m "chore(W13-D): finalize live-main reconciliation"
          git push origin HEAD:wave/13d-google-ads-asset-planning
