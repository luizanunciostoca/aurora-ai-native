name: Temporary W15-J Provider Formatter

on:
  push:
    branches:
      - wave/15j-real-local-physical-host-clean
    paths:
      - tools/physical/w15j-local-dp5-provider-runtime.mjs
      - .github/workflows/tmp-w15j-format-provider.yml

permissions:
  contents: read

jobs:
  format-provider:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Format provider and print exact diff
        run: |
          ./node_modules/.bin/prettier --write tools/physical/w15j-local-dp5-provider-runtime.mjs
          git diff -- tools/physical/w15j-local-dp5-provider-runtime.mjs
