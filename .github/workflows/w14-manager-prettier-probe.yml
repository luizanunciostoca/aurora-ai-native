name: W14 Manager Prettier Probe

on:
  push:
    branches:
      - prebuild/w14-v017-interaction-manager

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install workspace
        run: npm ci
      - name: Show canonical Prettier delta
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            services/mobile-gateway/src/interaction-session/manager.ts \
            services/mobile-gateway/src/interaction-session/types.ts \
            services/mobile-gateway/test/w14-interaction-session-manager.test.ts
          echo '<<<AURORA_PRETTIER_DIFF_BEGIN>>>'
          git diff -- \
            services/mobile-gateway/src/interaction-session/manager.ts \
            services/mobile-gateway/src/interaction-session/types.ts \
            services/mobile-gateway/test/w14-interaction-session-manager.test.ts
          echo '<<<AURORA_PRETTIER_DIFF_END>>>'
