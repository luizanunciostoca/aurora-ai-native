name: W14-C Fix 85f074c

on:
  push:
    branches:
      - scratch/w14c-fix-85f074c

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact canonical candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave/14c-progress-cancellation
          fetch-depth: 0
      - name: Assert expected candidate HEAD
        run: test "$(git rev-parse HEAD)" = "85f074c7c2ec5386cfbdb24e91532db540f04e16"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply exact TypeScript fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/mobile-gateway/src/progress-cancellation/manager.ts')
          text = path.read_text()
          unused = "  type ProgressCancellationPortResult,\n"
          narrowing = "    if (remembered !== undefined) {\n"
          assert text.count(unused) == 1, 'unexpected unused-import match count'
          assert text.count(narrowing) == 1, 'unexpected dedupe-narrowing match count'
          text = text.replace(unused, '')
          text = text.replace(narrowing, "    if (remembered !== undefined && existing !== undefined) {\n")
          path.write_text(text)
          PY
      - name: Apply canonical Prettier to W14-C scope
        run: |
          ./node_modules/.bin/prettier --write \
            services/mobile-gateway/src/progress-cancellation/index.ts \
            services/mobile-gateway/src/progress-cancellation/manager.ts \
            services/mobile-gateway/src/progress-cancellation/types.ts \
            services/mobile-gateway/src/progress-cancellation/tsconfig.json \
            services/mobile-gateway/src/progress-cancellation/tsconfig.build.json \
            services/mobile-gateway/src/progress-cancellation/tsconfig.test.json \
            services/mobile-gateway/src/progress-cancellation/test/w14c-progress-cancellation.test.ts
      - name: Build canonical contracts dependency
        run: npm run build --workspace @aurora/contracts
      - name: Build W14-C source
        run: ./node_modules/.bin/tsc --project services/mobile-gateway/src/progress-cancellation/tsconfig.build.json --pretty false
      - name: Compile W14-C focused test
        run: ./node_modules/.bin/tsc --project services/mobile-gateway/src/progress-cancellation/tsconfig.test.json --pretty false
      - name: Execute W14-C focused tests
        run: node --test services/mobile-gateway/src/progress-cancellation/dist-test/progress-cancellation/test/w14c-progress-cancellation.test.js
      - name: Cleanup generated output
        run: rm -rf services/mobile-gateway/src/progress-cancellation/dist services/mobile-gateway/src/progress-cancellation/dist-test packages/contracts/dist
      - name: Verify exact W14-C scope only
        run: |
          git diff --check
          unexpected=$(git diff --name-only | grep -v '^services/mobile-gateway/src/progress-cancellation/' || true)
          test -z "$unexpected" || { echo "Unexpected changed paths:"; echo "$unexpected"; exit 1; }
      - name: Commit validated fixes to canonical candidate
        run: |
          git config user.name "Aurora Program Control"
          git config user.email "aurora-program-control@users.noreply.github.com"
          git add services/mobile-gateway/src/progress-cancellation
          git commit -m "fix(W14-C): validate progress cancellation candidate"
          git push origin HEAD:wave/14c-progress-cancellation
