name: W03-D Format Temp

on:
  push:
    branches:
      - wave/03d-ordering-replay-dlq-fallback-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wave/03d-ordering-replay-dlq-fallback-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Format W03-D owned files only
        run: >-
          npx prettier --write
          packages/events/src/replay/index.ts
          packages/events/src/replay/replay-coordinator.ts
          packages/events/src/replay/types.ts
          packages/events/test/w03d-replay.test.mjs
      - name: Assert formatter scope and publish
        run: |
          set -euo pipefail
          git diff --name-only | grep -Ev '^(packages/events/src/replay/|packages/events/test/w03d-)' && exit 1 || true
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/events/src/replay packages/events/test/w03d-replay.test.mjs
          git commit -m 'chore(w03-d): apply canonical formatting'
          git push origin HEAD:wave/03d-ordering-replay-dlq-fallback-v2
