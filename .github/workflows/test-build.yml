name: Test Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate executor service
        run: |
          npx tsc -p services/executors/tsconfig.json --noEmit --pretty false
          rm -rf services/executors/dist
          npx tsc -p services/executors/tsconfig.json --pretty false
          node --test services/executors/dist/services/executors/test/*.test.js
          rm -rf services/executors/dist
      - run: npm run build
      - run: npm run audit:cleanup
