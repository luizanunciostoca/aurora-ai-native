name: Test Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify W15-J Experience Gate fail-closed evidence rules
        run: node tools/acceptance/w15j-experience-gate.test.mjs
      - run: npm run build
      - name: Verify offline W14 to W05/W06 local-model composition
        run: |
          node node_modules/typescript/bin/tsc -p services/mobile-gateway/tsconfig.test.json --pretty false
          node tools/test/local-model-session-composition.mjs
      - run: npm run audit:cleanup
