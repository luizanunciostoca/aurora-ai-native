name: Test Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run audit:cleanup
      - name: Render canonical W15-J semantic binder
        run: ./node_modules/.bin/prettier tools/acceptance/w15j-governed-execution-binding.mjs > /tmp/w15j-governed-execution-binding.mjs
      - name: Upload canonical W15-J semantic binder
        uses: actions/upload-artifact@v7
        with:
          name: w15j-semantic-binder-prettier
          path: /tmp/w15j-governed-execution-binding.mjs
          if-no-files-found: error
          retention-days: 1
