name: Test Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify W15-J Experience Gate fail-closed evidence rules
        run: node tools/acceptance/w15j-experience-gate.test.mjs
      - run: npm run build
      - run: npm run audit:cleanup
