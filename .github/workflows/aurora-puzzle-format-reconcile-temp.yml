name: Aurora Puzzle Format Reconcile Temp

on:
  push:
    branches:
      - program-control/puzzle-massively-parallel-execution
    paths:
      - '.github/workflows/aurora-puzzle-format-reconcile-temp.yml'

permissions:
  contents: write

jobs:
  format-and-self-delete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Puzzle branch
        uses: actions/checkout@v4
        with:
          ref: program-control/puzzle-massively-parallel-execution
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install workspace
        run: npm ci
      - name: Apply canonical Prettier formatting only to reported files
        run: >-
          npx prettier --write
          .github/workflows/aurora-copilot-orchestrator.yml
          docs/governance/copilot/AURORA_COPILOT_EXECUTION_MODE.json
          tools/copilot/claim-free-ready.mjs
          tools/copilot/free-worker-prompt.mjs
          tools/copilot/load-task-graph.mjs
          tools/copilot/materialize-ready.mjs
          tools/copilot/puzzle-policy.mjs
          tools/copilot/puzzle-policy.test.mjs
          tools/copilot/puzzle-prebuild-artifact.mjs
          tools/copilot/validate-execution-mode.mjs
      - name: Verify formatting scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/aurora-copilot-orchestrator.yml' \
            'docs/governance/copilot/AURORA_COPILOT_EXECUTION_MODE.json' \
            'tools/copilot/claim-free-ready.mjs' \
            'tools/copilot/free-worker-prompt.mjs' \
            'tools/copilot/load-task-graph.mjs' \
            'tools/copilot/materialize-ready.mjs' \
            'tools/copilot/puzzle-policy.mjs' \
            'tools/copilot/puzzle-policy.test.mjs' \
            'tools/copilot/puzzle-prebuild-artifact.mjs' \
            'tools/copilot/validate-execution-mode.mjs' | sort > /tmp/allowed
          comm -23 /tmp/actual /tmp/allowed | tee /tmp/unexpected
          test ! -s /tmp/unexpected
      - name: Commit formatting and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/aurora-puzzle-format-reconcile-temp.yml
          git add .
          git commit -m 'chore(program-control): apply canonical Puzzle formatting'
          git push origin HEAD:program-control/puzzle-massively-parallel-execution
