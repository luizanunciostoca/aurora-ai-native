name: W14 Interaction Gateway Prettier Probe

on:
  push:
    branches:
      - prebuild/w14-v017-interaction-gateway-adapter

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Show canonical Prettier delta
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            services/mobile-gateway/src/interaction-gateway/adapter.ts \
            services/mobile-gateway/src/interaction-gateway/types.ts \
            services/mobile-gateway/test/w14-interaction-gateway-adapter.test.ts
          echo '<<<AURORA_PRETTIER_DIFF_BEGIN>>>'
          git diff -- \
            services/mobile-gateway/src/interaction-gateway/adapter.ts \
            services/mobile-gateway/src/interaction-gateway/types.ts \
            services/mobile-gateway/test/w14-interaction-gateway-adapter.test.ts
          echo '<<<AURORA_PRETTIER_DIFF_END>>>'
