name: W03-F Format Temp

on:
  push:
    branches:
      - wave/03f-reality-gate-integration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wave/03f-reality-gate-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Format W03-F supported files
        run: npx prettier --write packages/workflow/test/w03f-reality-gate.test.mjs docs/governance/w03/W03_RECOVERY_RUNBOOK.md
      - name: Assert scope and publish
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          echo "$changed"
          echo "$changed" | grep -Ev '^(packages/workflow/test/w03f-reality-gate\.test\.mjs|docs/governance/w03/W03_RECOVERY_RUNBOOK\.md)$' && exit 1 || true
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/workflow/test/w03f-reality-gate.test.mjs docs/governance/w03/W03_RECOVERY_RUNBOOK.md
          git commit -m 'chore(w03-f): apply canonical formatting'
          git push origin HEAD:wave/03f-reality-gate-integration
