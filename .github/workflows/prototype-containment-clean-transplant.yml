name: Temporary clean containment transplant

on:
  push:
    branches: [wave/07g-w03-containment-state-clean]

permissions:
  contents: write

jobs:
  transplant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave/07g-w03-containment-state-clean
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Transplant final containment tree, harden fixtures, format and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin wave/07g-w03-containment-state
          files=(
            migrations/003_w03_execution_containment_state.sql
            packages/persistence/test/w03-execution-containment-migration.test.mjs
            services/executors/src/failure-containment/durable-containment-state.ts
            services/executors/src/failure-containment/durable-containment-transitions.ts
            services/executors/src/voice-intake/durable-current-containment-source.ts
            services/executors/test/w07g-durable-containment-state.test.ts
            services/executors/test/w07g-durable-containment-transitions.test.ts
            services/executors/test/w15j-durable-current-containment-source.test.ts
            services/mobile-gateway/src/physical-host/test/w03-containment-state-write.test.ts
            services/mobile-gateway/src/physical-host/test/w03-containment-state.test.ts
            services/mobile-gateway/src/physical-host/w03-containment-state-write.ts
            services/mobile-gateway/src/physical-host/w03-containment-state.ts
          )
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "origin/wave/07g-w03-containment-state:$path" > "$path"
          done
          python - <<'PY'
          from pathlib import Path

          p = Path('services/executors/src/failure-containment/durable-containment-transitions.ts')
          s = p.read_text()
          if "import type { ActionIntent } from '@aurora/contracts/actions';" not in s:
              s = "import type { ActionIntent } from '@aurora/contracts/actions';\n" + s
          s = s.replace("readonly probeActionIntentId?: string;", "readonly probeActionIntentId?: ActionIntent['actionIntentId'];")
          s = s.replace("probeActionIntentId: input.probeActionIntentId as never,", "probeActionIntentId: input.probeActionIntentId,")
          p.write_text(s)

          p = Path('services/executors/test/w07g-durable-containment-state.test.ts')
          s = p.read_text()
          if "import type { ActionIntent } from '@aurora/contracts/actions';" not in s:
              anchor = "import type { Rfc3339Timestamp } from '@aurora/contracts/context';"
              s = s.replace(anchor, "import type { ActionIntent } from '@aurora/contracts/actions';\n" + anchor)
          s = s.replace("halfOpenProbeActionIntentId: 'act_01ARZ3NDEKTSV4RRFFQ69G5FAV',", "halfOpenProbeActionIntentId: 'act_01ARZ3NDEKTSV4RRFFQ69G5FAV' as ActionIntent['actionIntentId'],")
          p.write_text(s)

          p = Path('services/executors/test/w15j-durable-current-containment-source.test.ts')
          s = p.read_text()
          if "import type { Rfc3339Timestamp } from '@aurora/contracts/context';" not in s:
              anchor = "import type { TenantId } from '@aurora/contracts/ids';"
              s = s.replace(anchor, "import type { Rfc3339Timestamp } from '@aurora/contracts/context';\n" + anchor)
          s = s.replace("const NOW = '2026-09-06T00:30:00.000Z';", "const NOW = '2026-09-06T00:30:00.000Z' as Rfc3339Timestamp;")
          s = s.replace("updatedAt: '2026-09-06T00:29:59.000Z',", "updatedAt: '2026-09-06T00:29:59.000Z' as Rfc3339Timestamp,")
          s = s.replace("changedAt: '2026-09-06T00:29:59.000Z'", "changedAt: '2026-09-06T00:29:59.000Z' as Rfc3339Timestamp")
          s = s.replace("policyTokenId: 'ptk_01ARZ3NDEKTSV4RRFFQ69G5FAV'", "policyTokenId: 'ptk_test_fixture'")
          p.write_text(s)

          p = Path('services/mobile-gateway/src/physical-host/w03-containment-state.ts')
          s = p.read_text()
          s = s.replace(
              "const probeOwner = probeInFlight ? probeOwnerRaw : null;",
              "const probeOwner: string | null =\n    probeInFlight && typeof probeOwnerRaw === 'string' ? probeOwnerRaw : null;",
          )
          p.write_text(s)
          PY
          npx prettier --write "${files[@]:1}"
          if ! npm test > /tmp/containment-test.log 2>&1; then
            tail -250 /tmp/containment-test.log
            exit 1
          fi
          rm .github/workflows/prototype-containment-clean-transplant.yml
          git config user.name 'Idebook Digital'
          git config user.email 'luizanunciostoca@gmail.com'
          git add "${files[@]}" .github/workflows/prototype-containment-clean-transplant.yml
          git commit -m 'feat(W07-G/W03): clean durable containment-state candidate'
          git push origin HEAD:wave/07g-w03-containment-state-clean
