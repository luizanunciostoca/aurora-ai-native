name: TEMP W12-B Prettier Artifact

on:
  push:
    branches:
      - wave/12b-meta-ads-account-read
    paths:
      - .github/workflows/zz-w12b-prettier-artifact.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier@3.9.6 --write packages/revenue/src/meta-ads/account-read.ts packages/revenue/test/w12b-meta-ads-account-read.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: w12b-prettier-output
          path: |
            packages/revenue/src/meta-ads/account-read.ts
            packages/revenue/test/w12b-meta-ads-account-read.test.ts
          retention-days: 1
