name: Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitive-files:
    name: sensitive-files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject prohibited sensitive files
        run: bash tools/security/check-sensitive-files.sh
      - name: Prove sensitive-file gate fails closed
        run: bash tools/security/check-sensitive-files.sh --self-test
      - name: Prove required environment validation fails closed
        run: bash tools/security/require-env.sh --self-test

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan changed commits for hardcoded secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'

  dependency-hygiene:
    name: dependency-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate active dependency hygiene
        run: bash tools/security/check-dependency-hygiene.sh

  dependency-scan:
    name: dependency-scan
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@ffa0a5f39214d80778c9b494822d94d0d9668458 # v2.5.0 workflow pin
    with:
      ref: ${{ github.sha }}
      fail-on-vuln: true
      upload-sarif: false
      scan-args: |-
        -r
        --experimental-exclude=reference
        --experimental-exclude=legacy-reference
        --experimental-exclude=legacy-manus-reference
        ./

  security-gate:
    name: security-gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - sensitive-files
      - secret-scan
      - dependency-hygiene
      - dependency-scan
    steps:
      - name: Enforce security results
        env:
          SENSITIVE_FILES_RESULT: ${{ needs.sensitive-files.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          DEPENDENCY_HYGIENE_RESULT: ${{ needs.dependency-hygiene.result }}
          DEPENDENCY_SCAN_RESULT: ${{ needs.dependency-scan.result }}
        run: |
          set -euo pipefail

          test "$SENSITIVE_FILES_RESULT" = "success"
          test "$SECRET_SCAN_RESULT" = "success"
          test "$DEPENDENCY_HYGIENE_RESULT" = "success"
          test "$DEPENDENCY_SCAN_RESULT" = "success"
