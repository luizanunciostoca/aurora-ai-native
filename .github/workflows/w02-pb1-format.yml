name: W02 PB1 Format

on:
  push:
    branches: [wave/02a-pb1-convergence]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Format W02-A files
        run: >-
          npx prettier --write
          packages/contracts/src/identity-resolution/index.ts
          packages/schemas/src/identity-resolution/identity-resolution.schema.ts
          services/identity/src/index.ts
          services/identity/test/identity-resolution.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "format already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/identity-resolution/index.ts packages/schemas/src/identity-resolution/identity-resolution.schema.ts services/identity/src/index.ts services/identity/test/identity-resolution.test.ts
          git commit -m "style(W02-A): apply canonical formatting"
          git push origin HEAD:wave/02a-pb1-convergence
