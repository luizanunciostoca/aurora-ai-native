name: W09E Format Temp

on:
  push:
    branches:
      - wave/09e-curated-workflow-migration

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          services/n8n-bridge/src/migration/types.ts
          services/n8n-bridge/src/migration/classifier.ts
          services/n8n-bridge/src/migration/index.ts
          services/n8n-bridge/test/w09e-curated-workflow-migration.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: w09e-prettier-output
          path: |
            services/n8n-bridge/src/migration/types.ts
            services/n8n-bridge/src/migration/classifier.ts
            services/n8n-bridge/src/migration/index.ts
            services/n8n-bridge/test/w09e-curated-workflow-migration.test.ts
          if-no-files-found: error
