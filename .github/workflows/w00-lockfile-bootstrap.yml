name: W00 Lockfile Bootstrap

on:
  push:
    branches: [wave/00-integration-remediation]

permissions:
  contents: write

jobs:
  bootstrap-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - name: Regenerate canonical npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile if changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(w00): regenerate canonical npm lockfile"
            git push origin HEAD:wave/00-integration-remediation
          fi
      - run: npm ci
      - run: npm run quality
      - run: npm test
      - run: npm run build
