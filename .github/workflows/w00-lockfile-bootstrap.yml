name: W00 Integration Verify

on:
  push:
    branches: [wave/00-integration-remediation]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - run: npm install --package-lock-only --ignore-scripts
      - name: Verify lockfile is already canonical
        run: git diff --exit-code -- package-lock.json
      - run: npm ci
      - run: npm run format
      - name: Emit canonical formatting diff
        run: git diff -- .github/dependabot.yml .github/ISSUE_TEMPLATE .github/workflows/security.yml tools/audit/repository-cleanup-audit.mjs
      - run: npm run quality
      - run: npm test
      - run: npm run build
      - run: bash tools/security/check-sensitive-files.sh
      - run: bash tools/security/check-sensitive-files.sh --self-test
      - run: bash tools/security/require-env.sh --self-test
      - run: bash tools/security/check-dependency-hygiene.sh
      - run: node tools/audit/repository-cleanup-audit.mjs
