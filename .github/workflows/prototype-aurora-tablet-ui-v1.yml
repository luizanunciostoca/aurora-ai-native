name: Prototype Aurora Tablet UI V3

on:
  push:
    branches:
      - prototype/aurora-tablet-ui-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-ui-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
      - name: Install stable Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Test and assemble Aurora Tablet UI V3
        shell: bash
        env:
          AURORA_BUILD_SHA: ${{ github.sha }}
        run: |
          gradle --no-daemon --console=plain -p apps/aurora-android \
            :app:testLocalDebugUnitTest \
            :app:assembleLocalDebug
          APK="$(find apps/aurora-android/app/build/outputs/apk/local/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p /tmp/aurora-tablet-ui-v3
          cp "$APK" /tmp/aurora-tablet-ui-v3/Aurora-Tablet-UI-V3.apk
          sha256sum /tmp/aurora-tablet-ui-v3/Aurora-Tablet-UI-V3.apk > /tmp/aurora-tablet-ui-v3/SHA256SUMS.txt
          cat > /tmp/aurora-tablet-ui-v3/BUILD_IDENTITY.txt <<EOF
          prototype_head=${{ github.sha }}
          w15j_base=6c247d2331f4aa4b4cee5455d8658a6fbdad3f4d
          ui_profile=TABLET_UI_V3
          app_version=0.16.0-alpha.3-local
          variant=localDebug
          voice_mode=tap-to-talk-stt-plus-tts
          wake_mode=preference-only
          EOF
      - name: Upload Aurora Tablet UI V3 APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-tablet-ui-v3
          path: /tmp/aurora-tablet-ui-v3
          if-no-files-found: error
          retention-days: 14
