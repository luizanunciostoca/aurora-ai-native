name: Prototype Aurora Tablet UI V4 Wake

on:
  push:
    branches:
      - prototype/aurora-tablet-ui-v1
      - prototype/aurora-wake-word-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-ui-v4-wake:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
      - name: Install stable Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Test and assemble Aurora Tablet UI V4 Wake
        shell: bash
        env:
          AURORA_BUILD_SHA: ${{ github.sha }}
        run: |
          gradle --no-daemon --console=plain -p apps/aurora-android \
            :app:testLocalDebugUnitTest \
            :app:assembleLocalDebug
          APK="$(find apps/aurora-android/app/build/outputs/apk/local/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p /tmp/aurora-tablet-ui-v4-wake
          cp "$APK" /tmp/aurora-tablet-ui-v4-wake/Aurora-Tablet-UI-V4-Wake.apk
          sha256sum /tmp/aurora-tablet-ui-v4-wake/Aurora-Tablet-UI-V4-Wake.apk > /tmp/aurora-tablet-ui-v4-wake/SHA256SUMS.txt
          BUILD_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > /tmp/aurora-tablet-ui-v4-wake/BUILD_IDENTITY.txt <<EOF
          prototype_head=${{ github.sha }}
          w15j_candidate=6c247d2331f4aa4b4cee5455d8658a6fbdad3f4d
          ui_profile=TABLET_UI_V4_WAKE
          app_version=0.17.0-alpha.1-local
          variant=localDebug
          target_sdk=36
          voice_mode=bounded-stt-plus-tts-plus-barge-in
          wake_mode=voiceinteraction-lifecycle-plus-local-microphone-fgs-kws
          wake_model=per-device-local-enrollment-template-pt-BR-v1
          wake_raw_audio_persistence=disabled
          wake_authority=none
          build_utc=${BUILD_UTC}
          EOF
      - name: Upload Aurora Tablet UI V4 Wake APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-tablet-ui-v4-wake
          path: /tmp/aurora-tablet-ui-v4-wake
          if-no-files-found: error
          retention-days: 14
