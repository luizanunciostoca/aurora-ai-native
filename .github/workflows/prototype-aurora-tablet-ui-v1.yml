name: Prototype Aurora Tablet UI V4 Wake Governed

on:
  push:
    branches:
      - prototype/aurora-tablet-ui-v1
      - prototype/aurora-wake-word-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-ui-v4-wake-governed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
      - name: Validate wake evidence tooling
        shell: bash
        run: |
          bash -n apps/aurora-android/physical/wake/collect-wake-physical-evidence.sh
          python3 -m json.tool apps/aurora-android/physical/wake/WAKE_EVIDENCE_TEMPLATE.json >/dev/null
          test -x apps/aurora-android/physical/wake/collect-wake-physical-evidence.sh
      - name: Install stable Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Test and assemble Aurora Tablet UI V4 Wake Governed
        shell: bash
        env:
          AURORA_BUILD_SHA: ${{ github.sha }}
        run: |
          gradle --no-daemon --console=plain -p apps/aurora-android \
            :app:testLocalDebugUnitTest \
            :app:assembleLocalDebug
          APK="$(find apps/aurora-android/app/build/outputs/apk/local/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ARTIFACT_DIR=/tmp/aurora-tablet-ui-v4-wake-governed
          mkdir -p "$ARTIFACT_DIR"
          cp "$APK" "$ARTIFACT_DIR/Aurora-Tablet-UI-V4-Wake-Governed.apk"
          (
            cd "$ARTIFACT_DIR"
            sha256sum Aurora-Tablet-UI-V4-Wake-Governed.apk > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          BUILD_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > "$ARTIFACT_DIR/BUILD_IDENTITY.txt" <<EOF
          prototype_head=${{ github.sha }}
          w15j_candidate=6c247d2331f4aa4b4cee5455d8658a6fbdad3f4d
          ui_profile=TABLET_UI_V4_WAKE_GOVERNED_FAST_PATH
          app_version=0.17.0-alpha.2-local
          variant=localDebug
          target_sdk=36
          voice_mode=bounded-stt-plus-tts-plus-barge-in
          voice_fast_path=w04-w15c-w15g-atomic-governed-projection
          voice_projection_default=empty-fail-closed
          w07_mobile_ingress=uncomposed-fail-closed
          voice_authority=none
          wake_mode=voiceinteraction-lifecycle-plus-local-microphone-fgs-kws
          wake_model=per-device-local-enrollment-template-pt-BR-v1
          wake_raw_audio_persistence=disabled
          wake_authority=none
          build_utc=${BUILD_UTC}
          EOF
      - name: Upload Aurora Tablet UI V4 Wake Governed APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-tablet-ui-v4-wake-governed
          path: /tmp/aurora-tablet-ui-v4-wake-governed
          if-no-files-found: error
          retention-days: 14
