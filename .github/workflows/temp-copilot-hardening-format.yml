name: TEMP Copilot Hardening Formatter

on:
  pull_request:
    paths:
      - 'tools/copilot/claim-free-ready.mjs'
      - '.github/workflows/temp-copilot-hardening-format.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/copilot-free-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply canonical formatter
        run: npx prettier --write tools/copilot/claim-free-ready.mjs
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/copilot/claim-free-ready.mjs
          git commit -m 'style(copilot): format Free claim hardening'
          git push origin HEAD:${{ github.head_ref }}
