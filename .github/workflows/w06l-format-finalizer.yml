name: W06-L Format Finalizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'wave/06l-memory-context-assembly'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: wave/06l-memory-context-assembly
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install workspace
        run: npm ci
      - name: Format W06-L candidate
        run: >-
          npx prettier --write
          packages/context/src/memory-fabric/index.ts
          packages/context/src/memory-fabric/context-assembly.ts
          packages/context/test/w06l-memory-context-assembly.test.ts
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/w06l-format-finalizer.yml
          git config user.name aurora-ci-finalizer
          git config user.email aurora-ci-finalizer@users.noreply.github.com
          git add packages/context/src/memory-fabric/index.ts \
                  packages/context/src/memory-fabric/context-assembly.ts \
                  packages/context/test/w06l-memory-context-assembly.test.ts
          git diff --cached --check
          git commit -m 'style: format W06-L memory context candidate'
          git push origin HEAD:wave/06l-memory-context-assembly
