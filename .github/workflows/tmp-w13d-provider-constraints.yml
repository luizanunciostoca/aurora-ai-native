name: Temporary W13-D Provider Constraint Hardening

on:
  push:
    branches:
      - wave/13d-google-ads-asset-planning

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Apply official Google Ads provider constraints and regression coverage
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          src_path = Path('packages/revenue/src/google-ads/asset-planning.ts')
          src = src_path.read_text()

          old_logo = """  return media.width >= 128 && media.height >= 128;\n"""
          new_logo = """  const squareLogo =\n    media.width >= 128 &&\n    media.height >= 128 &&\n    imageRatioWithin(media.width, media.height, 1, 0.01);\n  const landscapeLogo =\n    media.width >= 512 &&\n    media.height >= 128 &&\n    imageRatioWithin(media.width, media.height, 4, 0.01);\n  return squareLogo || landscapeLogo;\n"""
          if old_logo not in src:
              raise SystemExit('logo validation anchor not found')
          src = src.replace(old_logo, new_logo, 1)

          pattern = re.compile(r"function satisfiesSurfaceRequirements\(.*?\n\}\n\nfunction freezeAssets", re.S)
          replacement = """function satisfiesSurfaceRequirements(\n  surface: GoogleAdsAssetPlanningSurface,\n  assets: readonly GoogleAdsPlanningAsset[],\n): boolean {\n  const headlines = countKind(assets, 'HEADLINE');\n  const longHeadlines = countKind(assets, 'LONG_HEADLINE');\n  const descriptions = countKind(assets, 'DESCRIPTION');\n  const marketingImages = countKind(assets, 'MARKETING_IMAGE');\n  const squareMarketingImages = countKind(assets, 'SQUARE_MARKETING_IMAGE');\n  const logos = countKind(assets, 'LOGO_IMAGE');\n  const videos = assets.filter((asset) => asset.kind === 'YOUTUBE_VIDEO');\n\n  if (surface === 'PERFORMANCE_MAX') {\n    const videosMeetPmaxDuration = videos.every(\n      (asset) =>\n        asset.media?.durationSeconds !== undefined && asset.media.durationSeconds >= 10,\n    );\n    return (\n      headlines >= 3 &&\n      headlines <= 15 &&\n      longHeadlines >= 1 &&\n      longHeadlines <= 5 &&\n      descriptions >= 2 &&\n      descriptions <= 5 &&\n      hasShortDescription(assets) &&\n      marketingImages >= 1 &&\n      marketingImages <= 20 &&\n      squareMarketingImages >= 1 &&\n      squareMarketingImages <= 20 &&\n      logos <= 5 &&\n      videos.length <= 15 &&\n      videosMeetPmaxDuration\n    );\n  }\n\n  if (surface === 'DISPLAY') {\n    return (\n      headlines >= 1 &&\n      headlines <= 5 &&\n      longHeadlines === 1 &&\n      descriptions >= 1 &&\n      descriptions <= 5 &&\n      marketingImages >= 1 &&\n      squareMarketingImages >= 1 &&\n      marketingImages + squareMarketingImages <= 15 &&\n      logos <= 5 &&\n      videos.length <= 5\n    );\n  }\n\n  return videos.length === 1;\n}\n\nfunction freezeAssets"""
          src2, count = pattern.subn(replacement, src, count=1)
          if count != 1:
              raise SystemExit(f'surface requirements replacement count={count}')
          src_path.write_text(src2)

          test_path = Path('packages/revenue/test/w13d-google-ads-asset-planning.test.ts')
          tests = test_path.read_text()
          old_video = """function videoAsset(assetId = 'video-1'): GoogleAdsPlanningAsset {\n  return {\n    assetId,\n    kind: 'YOUTUBE_VIDEO',\n    media: {\n      mediaReference: `youtube:${assetId}`,\n      mimeType: 'video/mp4',\n      durationSeconds: 30,\n    },\n    provenance: provenance(assetId),\n  };\n}\n"""
          new_video = """function videoAsset(assetId = 'video-1', durationSeconds = 30): GoogleAdsPlanningAsset {\n  return {\n    assetId,\n    kind: 'YOUTUBE_VIDEO',\n    media: {\n      mediaReference: `youtube:${assetId}`,\n      mimeType: 'video/mp4',\n      durationSeconds,\n    },\n    provenance: provenance(assetId),\n  };\n}\n"""
          if old_video not in tests:
              raise SystemExit('video helper anchor not found')
          tests = tests.replace(old_video, new_video, 1)

          anchor = """test('W13-D fails closed on provenance, duplicate assets, malformed costs and incompatible capability', () => {\n"""
          extra = """test('W13-D enforces current PMax provider maxima and minimum supplied-video duration', () => {\n  const tooManyHeadlines = [\n    ...pmaxAssets(),\n    ...Array.from({ length: 13 }, (_, index) =>\n      textAsset(`extra-headline-${index}`, 'HEADLINE', `Extra headline ${index}`),\n    ),\n  ];\n  assert.deepEqual(planGoogleAdsAssets(fixture({ assets: tooManyHeadlines })), {\n    status: 'BLOCKED',\n    code: 'MISSING_REQUIRED_ASSET',\n  });\n\n  assert.deepEqual(\n    planGoogleAdsAssets(fixture({ assets: [...pmaxAssets(), videoAsset('short-video', 9.9)] })),\n    { status: 'BLOCKED', code: 'MISSING_REQUIRED_ASSET' },\n  );\n\n  const validVideo = planGoogleAdsAssets(\n    fixture({ assets: [...pmaxAssets(), videoAsset('valid-video', 10)] }),\n  );\n  assert.equal(validVideo.status, 'READY');\n});\n\ntest('W13-D enforces responsive Display combined-media and video maxima', () => {\n  const baseDisplay: readonly GoogleAdsPlanningAsset[] = [\n    textAsset('display-headline-max', 'HEADLINE', 'Conheça a experiência'),\n    textAsset('display-long-max', 'LONG_HEADLINE', 'Descubra uma experiência criada para momentos especiais'),\n    textAsset('display-description-max', 'DESCRIPTION', 'Veja detalhes e planeje sua visita.'),\n    imageAsset('display-landscape-max', 'MARKETING_IMAGE', 1200, 628),\n    imageAsset('display-square-max', 'SQUARE_MARKETING_IMAGE', 600, 600),\n  ];\n\n  const tooManyImages = [\n    ...baseDisplay,\n    ...Array.from({ length: 14 }, (_, index) =>\n      imageAsset(`display-extra-${index}`, 'MARKETING_IMAGE', 1200, 628),\n    ),\n  ];\n  assert.deepEqual(planGoogleAdsAssets(fixture({ surface: 'DISPLAY', assets: tooManyImages })), {\n    status: 'BLOCKED',\n    code: 'MISSING_REQUIRED_ASSET',\n  });\n\n  const tooManyVideos = [\n    ...baseDisplay,\n    ...Array.from({ length: 6 }, (_, index) => videoAsset(`display-video-${index}`)),\n  ];\n  assert.deepEqual(planGoogleAdsAssets(fixture({ surface: 'DISPLAY', assets: tooManyVideos })), {\n    status: 'BLOCKED',\n    code: 'MISSING_REQUIRED_ASSET',\n  });\n});\n\ntest('W13-D rejects logo dimensions that match neither supported Google Ads logo ratio', () => {\n  assert.deepEqual(\n    planGoogleAdsAssets(\n      fixture({ assets: [...pmaxAssets(), imageAsset('invalid-logo', 'LOGO_IMAGE', 400, 300)] }),\n    ),\n    { status: 'BLOCKED', code: 'ASSET_CONSTRAINT_VIOLATION' },\n  );\n});\n\n"""
          if anchor not in tests:
              raise SystemExit('test insertion anchor not found')
          tests = tests.replace(anchor, extra + anchor, 1)
          test_path.write_text(tests)
          PY
          npx prettier --write packages/revenue/src/google-ads/asset-planning.ts packages/revenue/test/w13d-google-ads-asset-planning.test.ts
          npm run format:check
          npm run typecheck
          npm test
          npm run build
          git config user.name "aurora-program-control"
          git config user.email "actions@users.noreply.github.com"
          git add packages/revenue/src/google-ads/asset-planning.ts packages/revenue/test/w13d-google-ads-asset-planning.test.ts
          git rm .github/workflows/tmp-w13d-provider-constraints.yml
          git commit -m "fix(W13-D): enforce Google Ads asset limits"
          git push origin HEAD:wave/13d-google-ads-asset-planning
